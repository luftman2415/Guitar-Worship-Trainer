<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Guitar Worship Trainer Pro</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%234f46e5'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='250' fill='white'%3EGW%3C/text%3E%3C/svg%3E" />

    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

        // --- Error Boundary ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("GW Error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 text-center bg-slate-50 dark:bg-slate-900">
                            <div className="max-w-md bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl">
                                <div className="text-red-500 text-5xl mb-4">⚠️</div>
                                <h2 className="text-xl font-bold mb-2 dark:text-white">Algo salió mal</h2>
                                <p className="text-slate-500 mb-6 text-sm">Error: {this.state.error?.message || 'Desconocido'}</p>
                                <button onClick={() => window.location.reload()} className="bg-brand-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-brand-700 transition-colors w-full">Recargar Aplicación</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- ICONOS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                home: <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>,
                mic: <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>,
                micOff: <path d="M1 1l22 22M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>,
                activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>,
                music: <path d="M9 18V5l12-2v13"></path>,
                grid: <rect x="3" y="3" width="7" height="7"></rect>,
                sun: <circle cx="12" cy="12" r="5"></circle>,
                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>,
                play: <polygon points="5 3 19 12 5 21 5 3"></polygon>,
                pause: <rect x="6" y="4" width="4" height="16"></rect>,
                stop: <rect x="6" y="6" width="12" height="12"></rect>,
                plus: <line x1="12" y1="5" x2="12" y2="19"></line>,
                minus: <line x1="5" y1="12" x2="19" y2="12"></line>,
                search: <circle cx="11" cy="11" r="8"></circle>,
                trash: <polyline points="3 6 5 6 21 6"></polyline>,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>,
                award: <circle cx="12" cy="8" r="7"></circle>,
                clock: <circle cx="12" cy="12" r="10"></circle>,
                x: <line x1="18" y1="6" x2="6" y2="18"></line>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>,
                analyze: <path d="M2 12h10M9 4v16M3 7l13 13M16 7l-13 13"></path>,
                alert: <circle cx="12" cy="12" r="10"></circle>,
                book: <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>,
                ear: <path d="M12 2a10 10 0 0 0-10 10v7a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H4a8 8 0 0 1 15.6 1.6"></path>,
                circle: <circle cx="12" cy="12" r="10"></circle>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>,
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path>,
                layers: <g><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></g>,
                repeat: <g><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></g>,
                lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                file: <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>,
                check: <polyline points="20 6 9 17 4 12"></polyline>,
                rewind: <polygon points="11 19 2 12 11 5 11 19"></polygon>,
                arrowLeft: <g><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></g>
            };
            return (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>);
        };

        // --- UTILS DE BASE DE DATOS (IndexedDB) ---
        const DB_NAME = 'gwt_audio_db'; const DB_STORE = 'recordings';
        const openDB = () => new Promise((resolve, reject) => { const request = indexedDB.open(DB_NAME, 1); request.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' }); }; request.onsuccess = (e) => resolve(e.target.result); request.onerror = (e) => reject(e.target.error); });
        const saveRecordingToDB = async (recording) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readwrite'); tx.objectStore(DB_STORE).put(recording); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); }); };
        const getRecordingsFromDB = async () => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readonly'); const req = tx.objectStore(DB_STORE).getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); };
        const getRecordingById = async (id) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readonly'); const req = tx.objectStore(DB_STORE).get(id); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); };
        const deleteRecordingFromDB = async (id) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readwrite'); const req = tx.objectStore(DB_STORE).delete(id); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); };

        // --- CONTEXTOS ---
        const DialogContext = createContext();
        const DialogProvider = ({ children }) => {
            const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', type: 'confirm', onConfirm: null, promptMode: false });
            const close = () => setDialog({ ...dialog, isOpen: false, promptMode: false });
            const confirm = ({ title, message, onConfirm }) => setDialog({ isOpen: true, title, message, type: 'confirm', onConfirm: () => { onConfirm(); close(); } });
            const alert = ({ title, message }) => setDialog({ isOpen: true, title, message, type: 'alert', onConfirm: () => close() });
            const prompt = ({ title, message, onConfirm }) => setDialog({ isOpen: true, title, message, type: 'confirm', promptMode: true, onConfirm: (val) => { onConfirm(val); close(); } });
            return (
                <DialogContext.Provider value={{ confirm, alert, prompt }}>
                    {children}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-slate-100 dark:border-slate-700">
                                <div className="p-6 text-center">
                                    <div className="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4 bg-brand-100 text-brand-600"><Icon name="alert" size={24} /></div>
                                    <h3 className="text-xl font-bold mb-2 dark:text-white">{dialog.title}</h3>
                                    <p className="text-slate-500 mb-6 text-sm">{dialog.message}</p>
                                    {dialog.promptMode && <input id="promptInput" autoFocus className="w-full p-3 mb-6 bg-slate-50 dark:bg-slate-700 rounded-xl dark:text-white border border-slate-200 dark:border-slate-600" />}
                                    <div className="flex gap-3 justify-center">
                                        <button onClick={close} className="px-5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-500 font-bold">Cancelar</button>
                                        <button onClick={() => dialog.promptMode ? dialog.onConfirm(document.getElementById('promptInput').value) : dialog.onConfirm()} className="px-6 py-2 rounded-xl bg-brand-600 text-white font-bold">Confirmar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </DialogContext.Provider>
            );
        };
        const useDialog = () => useContext(DialogContext);

        const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const SCALES = { 'Mayor (Jónica)': [0, 2, 4, 5, 7, 9, 11], 'Dórica': [0, 2, 3, 5, 7, 9, 10], 'Frigia': [0, 1, 3, 5, 7, 8, 10], 'Lidia': [0, 2, 4, 6, 7, 9, 11], 'Mixolidia': [0, 2, 4, 5, 7, 9, 10], 'Menor (Eólica)': [0, 2, 3, 5, 7, 8, 10], 'Locria': [0, 1, 3, 5, 6, 8, 10], 'Pentatónica Menor': [0, 3, 5, 7, 10], 'Pentatónica Mayor': [0, 2, 4, 7, 9], 'Blues': [0, 3, 5, 6, 7, 10] };
        const CHORD_FORMULAS = [{ name: "Mayor", formula: "1 - 3 - 5", example: "C - E - G" }, { name: "Menor", formula: "1 - b3 - 5", example: "C - Eb - G" }, { name: "Disminuido", formula: "1 - b3 - b5", example: "C - Eb - Gb" }, { name: "Aumentado", formula: "1 - 3 - #5", example: "C - E - G#" }, { name: "Sus2", formula: "1 - 2 - 5", example: "C - D - G" }, { name: "Sus4", formula: "1 - 4 - 5", example: "C - F - G" }, { name: "Maj7", formula: "1 - 3 - 5 - 7", example: "C - E - G - B" }, { name: "min7", formula: "1 - b3 - 5 - b7", example: "C - Eb - G - Bb" }, { name: "Dom7", formula: "1 - 3 - 5 - b7", example: "C - E - G - Bb" }];

        const useAudioContext = () => {
            const audioContextRef = useRef(null);
            const getContext = useCallback(() => { if (!audioContextRef.current) { const AudioContextClass = window.AudioContext || window.webkitAudioContext; if (AudioContextClass) audioContextRef.current = new AudioContextClass(); } return audioContextRef.current; }, []);
            const resume = useCallback(async () => { const ctx = getContext(); if (ctx && ctx.state === 'suspended') await ctx.resume(); return ctx; }, [getContext]);
            return { getContext, resume };
        };

        const usePadEngine = () => {
            const [activeKey, setActiveKey] = useState(null); const [volume, setVolume] = useState(0.3); const [isPlaying, setIsPlaying] = useState(false); const audioCtxRef = useRef(null); const gainNodeRef = useRef(null); const oscillatorsRef = useRef([]); const KEYS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const getCtx = () => { if (!audioCtxRef.current) { const AudioContextClass = window.AudioContext || window.webkitAudioContext; const ctx = new AudioContextClass(); const masterGain = ctx.createGain(); masterGain.connect(ctx.destination); masterGain.gain.value = 0; audioCtxRef.current = ctx; gainNodeRef.current = masterGain; } return audioCtxRef.current; };
            useEffect(() => { if (gainNodeRef.current && audioCtxRef.current) gainNodeRef.current.gain.setTargetAtTime(isPlaying ? volume : 0, audioCtxRef.current.currentTime, 0.1); }, [volume, isPlaying]);
            useEffect(() => { if (!activeKey || !isPlaying) return; const ctx = getCtx(); oscillatorsRef.current.forEach(({ osc, gain }) => { try { gain.gain.setTargetAtTime(0, ctx.currentTime, 0.5); setTimeout(() => { try{ osc.stop(); }catch(e){} }, 600); } catch(e){} }); oscillatorsRef.current = []; const rootIndex = KEYS.indexOf(activeKey); const freqs = [130.81 * Math.pow(2, rootIndex / 12), 130.81 * Math.pow(2, (rootIndex + 7) / 12), 261.63 * Math.pow(2, rootIndex / 12)]; freqs.forEach((freq, i) => { const osc = ctx.createOscillator(); const oscGain = ctx.createGain(); const filter = ctx.createBiquadFilter(); osc.type = i === 2 ? 'sine' : 'sawtooth'; osc.frequency.value = freq; filter.type = 'lowpass'; filter.frequency.value = 600; osc.connect(filter); filter.connect(oscGain); oscGain.connect(gainNodeRef.current); oscGain.gain.setValueAtTime(0, ctx.currentTime); oscGain.gain.linearRampToValueAtTime(0.2 / (i + 1), ctx.currentTime + 1); osc.start(); oscillatorsRef.current.push({ osc, gain: oscGain }); }); }, [activeKey, isPlaying]);
            const togglePlay = async () => { const ctx = getCtx(); if (ctx.state === 'suspended') await ctx.resume(); const newState = !isPlaying; setIsPlaying(newState); if (!newState) { oscillatorsRef.current.forEach(({ osc, gain }) => { gain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); setTimeout(() => { try{ osc.stop(); }catch(e){} }, 200); }); oscillatorsRef.current = []; } };
            const selectKey = (k) => { setActiveKey(k); if (!isPlaying) togglePlay(); };
            return { activeKey, setActiveKey: selectKey, volume, setVolume, isPlaying, togglePlay, KEYS };
        };

        const ChordBuilder = ({ initialData, onSave, onCancel }) => {
            const [name, setName] = useState(initialData?.name || 'Nuevo Acorde'); const [dots, setDots] = useState(initialData?.dots || []); const [muted, setMuted] = useState(initialData?.muted || [false,false,false,false,false,false]); const [baseFret, setBaseFret] = useState(initialData?.baseFret || 1); const [saveGlobal, setSaveGlobal] = useState(false);
            const toggleStringState = (stringIdx) => { const newMuted = [...muted]; newMuted[stringIdx] = !newMuted[stringIdx]; setMuted(newMuted); };
            const handleFretClick = (stringIdx, fret) => { const existingDotIndex = dots.findIndex(d => d.string === stringIdx && d.fret === fret); if (existingDotIndex >= 0) { const dot = dots[existingDotIndex]; if (dot.type === 'note') { const newDots = [...dots]; newDots[existingDotIndex].type = 'root'; setDots(newDots); } else { setDots(dots.filter((_, i) => i !== existingDotIndex)); } } else { const cleanDots = dots.filter(d => d.string !== stringIdx); setDots([...cleanDots, { string: stringIdx, fret, type: 'note' }]); const newMuted = [...muted]; newMuted[stringIdx] = false; setMuted(newMuted); } };
            const handleSave = () => { const chordData = { name, dots, muted, baseFret }; if (saveGlobal) { const libraryRaw = localStorage.getItem('gwt_chord_library'); const library = libraryRaw ? JSON.parse(libraryRaw) : []; library.push({ ...chordData, id: Date.now() }); localStorage.setItem('gwt_chord_library', JSON.stringify(library)); } onSave(chordData); };
            return (<div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4"><div className="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-modal border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto"><h3 className="text-lg font-bold mb-4 dark:text-white">Constructor de Acordes</h3><input value={name} onChange={e => setName(e.target.value)} className="w-full p-2 mb-3 bg-slate-100 dark:bg-slate-700 rounded border dark:border-slate-600 dark:text-white font-bold text-center" placeholder="Nombre (Ej: Gadd9)"/><div className="flex items-center justify-center gap-2 mb-4"><label className="text-xs font-bold text-slate-500">Traste Base:</label><input type="number" min="1" max="20" value={baseFret} onChange={e => setBaseFret(Number(e.target.value))} className="w-16 p-1 bg-slate-100 dark:bg-slate-700 rounded border dark:border-slate-600 dark:text-white text-center font-bold"/></div><div className="relative w-[200px] h-[240px] mx-auto bg-white dark:bg-slate-900 border-2 border-slate-800 dark:border-slate-600 rounded select-none mb-4 shadow-inner">{[1,2,3,4].map(i => <div key={i} className="absolute w-full h-[1px] bg-slate-300 dark:bg-slate-600" style={{ top: `${i * 20}%` }}></div>)}{[0,1,2,3,4,5].map(i => <div key={i} className="absolute h-full w-[1px] bg-slate-800 dark:bg-slate-500" style={{ left: `${10 + i * 16}%` }}></div>)}<div className="absolute -top-6 w-full flex justify-between px-[10%]">{[0,1,2,3,4,5].map(s => (<div key={s} onClick={() => toggleStringState(s)} className="cursor-pointer w-6 text-center text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-white" style={{ position: 'absolute', left: `${10 + s * 16}%`, transform: 'translateX(-50%)' }}>{muted[s] ? 'X' : (dots.some(d => d.string === s) ? '' : 'O')}</div>))}</div>{baseFret > 1 && (<div className="absolute top-[8%] -right-8 text-sm font-bold text-slate-400">T{baseFret}</div>)}{[0,1,2,3,4].map(fret => (<div key={fret} className="absolute w-full h-[20%]" style={{ top: `${fret * 20}%` }}>{[0,1,2,3,4,5].map(str => { const dot = dots.find(d => d.string === str && d.fret === fret + 1); return (<div key={str} onClick={() => handleFretClick(str, fret + 1)} className="absolute w-[16%] h-full cursor-pointer flex items-center justify-center" style={{ left: `${10 + str * 16}%`, transform: 'translateX(-50%)' }}>{dot && (<div className={`w-4 h-4 rounded-full shadow-sm z-10 ${dot.type === 'root' ? 'bg-green-500 ring-2 ring-green-200' : 'bg-slate-800 dark:bg-white'}`}></div>)}</div>) })}</div>))}</div><div className="flex items-center gap-2 mb-6 justify-center"><input type="checkbox" id="saveGlobal" checked={saveGlobal} onChange={e => setSaveGlobal(e.target.checked)} className="w-4 h-4 accent-cyan-600 rounded"/><label htmlFor="saveGlobal" className="text-xs text-slate-600 dark:text-slate-300 font-bold select-none cursor-pointer">Guardar en Biblioteca Global</label></div><div className="flex gap-2"><button onClick={handleSave} className="flex-1 bg-cyan-600 text-white py-2 rounded-xl font-bold hover:bg-cyan-700">Guardar</button><button onClick={onCancel} className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-500 font-bold rounded-xl">Cancelar</button></div></div></div>);
        };

        const ChordDisplay = ({ chord, size = "small", onClick }) => {
            if (!chord) return null;
            let scale = 0.5;
            if (size === "medium") { scale = 0.8; }
            if (size === "large") { scale = 2.8; }

            const fretFontSize = size === 'large' ? '26px' : `${16 * scale}px`;
            const fretPosClass = size === 'large' ? '-right-14 top-[6%]' : '-right-[35%] top-[8%]';

            return (
                <div onClick={onClick} className={`flex flex-col items-center mx-2 mb-2 ${onClick ? 'cursor-pointer active:scale-95 transition-transform' : ''}`}>
                    <div className="relative bg-white dark:bg-slate-900 border border-slate-800 dark:border-slate-500 rounded-sm shadow-sm" style={{ width: `${80 * scale}px`, height: `${100 * scale}px` }}>
                            {[1,2,3,4].map(i => <div key={i} className="absolute w-full h-[1px] bg-slate-300 dark:bg-slate-600" style={{ top: `${i * 20}%` }}></div>)}
                            {[0,1,2,3,4,5].map(i => <div key={i} className="absolute h-full w-[1px] bg-slate-800 dark:bg-slate-500" style={{ left: `${10 + i * 16}%` }}></div>)}
                            
                            {chord.baseFret > 1 && (
                                <div className={`absolute ${fretPosClass} font-bold text-slate-500 dark:text-slate-400 leading-none`} 
                                     style={{ fontSize: fretFontSize }}>T{chord.baseFret}</div>
                            )}

                            {chord.dots.map((d, i) => (<div key={i} className={`absolute rounded-full ${d.type === 'root' ? 'bg-red-500' : 'bg-slate-800 dark:bg-white'}`} style={{ left: `${10 + d.string * 16}%`, top: `${(d.fret - 1) * 20 + 10}%`, transform: 'translate(-50%, -50%)', width: `${14 * scale}px`, height: `${14 * scale}px`, boxShadow: '0 1px 2px rgba(0,0,0,0.3)' }}></div>))}
                            {chord.muted.map((m, s) => (m && <div key={s} className="absolute -top-[18%] font-bold text-slate-500" style={{ left: `${10 + s * 16}%`, transform: 'translateX(-50%)', fontSize: `${14 * scale}px` }}>X</div>))}
                    </div>
                    <span className={`font-black mt-2 dark:text-white truncate text-center ${size==='large' ? 'text-2xl mt-4' : 'text-[10px]'}`}>{chord.name}</span>
                </div>
            );
        };

        const TrackTrainer = () => {
            const [view, setView] = useState('list'); const [activeTab, setActiveTab] = useState('my_songs'); const [songs, setSongs] = useState(() => { const saved = localStorage.getItem('gwt_songs'); return saved ? JSON.parse(saved) : []; }); const [currentSong, setCurrentSong] = useState(null); const dialog = useDialog();

        const PracticeRoutine = () => { const [view, setView] = useState('landing'); const [currentExercise, setCurrentExercise] = useState(null); const [timer, setTimer] = useState(0); const [isActive, setIsActive] = useState(false); const [customTime, setCustomTime] = useState(5); const intervalRef = useRef(null); const EXERCISES = [{ id: 1, category: "CALENTAMIENTO", name: "Spider Walk (1-2-3-4)", desc: "Dedo por traste en todas las cuerdas. Ida y vuelta.", defaultTime: 5 }, { id: 2, category: "TÉCNICA", name: "Bending y Vibrato", desc: "Bend de tono completo. Vibrato lento y controlado.", defaultTime: 10 }, { id: 3, category: "RITMO", name: "Funk Strumming (Muting)", desc: "Mano izquierda muda cuerdas. Ritmo semicorcheas.", defaultTime: 10 }, { id: 4, category: "TEORÍA", name: "Escala Mayor (3 Octavas)", desc: "Círculo de cuartas. Todas las posiciones.", defaultTime: 15 }, { id: 5, category: "REPERTORIO", name: "Repaso Canciones", desc: "Tocar setlist completo sin detenerse.", defaultTime: 20 }]; useEffect(() => { if (isActive && timer > 0) { intervalRef.current = setInterval(() => setTimer(t => t - 1), 1000); } else if (timer === 0) { setIsActive(false); if(intervalRef.current) clearInterval(intervalRef.current); } return () => clearInterval(intervalRef.current); }, [isActive, timer]); const startExercise = (ex) => { setCurrentExercise(ex); setCustomTime(ex.defaultTime); setTimer(ex.defaultTime * 60); setIsActive(false); setView('active'); }; const toggleTimer = () => setIsActive(!isActive); const resetTimer = () => { setIsActive(false); setTimer(customTime * 60); }; const adjustTime = (delta) => { const newTime = Math.max(1, customTime + delta); setCustomTime(newTime); if (!isActive) setTimer(newTime * 60); }; const formatTime = (seconds) => { const m = Math.floor(seconds / 60); const s = seconds % 60; return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`; }; if (view === 'landing') return (<div className="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 r ade-in"><button onClick={() => setView('list')} className="absolute top-6 left-6 p-2 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-500 hover:text-slate-800"><Icon name="arrowLeft" size={20} /></button><span className="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-2 block mt-2">{currentExercise.category}</span><h2 className="text-2xl font-black mb-2 dark:text-white">{currentExercise.name}</h2><p className="text-sm text-slate-500 dark:text-slate-400 mb-8">{currentExercise.desc}</p><div className="relative w-64 h-64 mx-auto mb-8 flex items-center justify-center"><div className="absolute inset-0 rounded-full border-8 border-slate-100 dark:border-slate-700"></div><div className={`absolute inset-0 rounded-full border-8 border-indigo-500 transition-all duration-1000 ${isActive ? 'opacity-100' : 'opacity-30'}`} style={{ clipPath: `inset(0 0 ${100 - (timer / (customTime * 60) * 100)}% 0)` }}></div><div className="flex flex-col items-center z-10"><span className="text-6xl font-black font-mono text-slate-800 dark:text-white tracking-tighter">{formatTime(timer)}</span>{!isActive && <div className="flex gap-4 mt-2"><button onClick={() => adjustTime(-1)} className="p-1 text-slate-400 hover:text-indigo-500"><Icon name="minus" size={16}/></button><span className="text-xs font-bold text-slate-500">{customTime} min</span><button onClick={() => adjustTime(1)} className="p-1 text-slate-400 hover:text-indigo-500"><Icon name="plus" size={16}/></button></div>}</div></div><div className="flex gap-4 justify-center"><button onClick={toggleTimer} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95 ${isActive ? 'bg-amber-500 text-white' : 'bg-indigo-600 text-white'}`}><Icon name={isActive ? "pause" : "play"} size={32} fill="currentColor" /></button><button onClick={resetTimer} className="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600"><Icon name="repeat" size={24} /></button></div></div>); };
        const PadPlayer = ({ engine }) => { const { activeKey, setActiveKey, volume, setVolume, isPlaying, togglePlay, KEYS } = engine; return (<div className="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 animate-fade-in"><div className="flex items-center gap-4 mb-8"><div className="p-3 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-full"><Icon name="layers" size={32} /></div><div><h2 className="text-3xl font-black dark:text-white">Worship Pads</h2><p className="text-slate-500 text-sm">Sonido ambiental continuo</p></div></div><div className="grid grid-cols-4 gap-3 mb-8">{KEYS.map(k => (<button key={k} onClick={() => setActiveKey(k)} className={`py-4 rounded-xl font-bold text-lg transition-all shadow-sm ${activeKey === k && isPlaying ? 'bg-indigo-600 text-white shadow-indigo-500/50 scale-105' : 'bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600'}`}>{k}</button>))}</div><div className="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-2xl flex items-center gap-6"><button onClick={togglePlay} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-lg transition-all active:scale-95 shrink-0 ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400'}`}><Icon name={isPlaying ? "pause" : "play"} size={28} fill="currentColor" /></button><div className="flex-1"><label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Volumen Master</label><input type="range" min="0" max="1" step="0.01" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-full h-2 bg-slate-200 rounded-full appearance-none cursor-pointer dark:bg-slate-700 accent-indigo-600"/></div></div></div>); };
        const Footer = () => (<footer className="w-full text-center py-8 text-xs text-slate-400 font-medium">Copyright © 2026 LUFTMANDMAURICIO</footer>);

        const App = () => {
            const [view, setView] = useState('home');
            const [darkMode, setDarkMode] = useState(false);
            const [updateTrigger, setUpdateTrigger] = useState(0);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstall, setShowInstall] = useState(false);
            const padEngine = usePadEngine();

            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setDarkMode(true);
                const handleStorage = () => setUpdateTrigger(p => p + 1);
                const handleStatsUpdate = () => setUpdateTrigger(p => p + 1);
                window.addEventListener('storage', handleStorage);
                window.addEventListener('gwt-stats-updated', handleStatsUpdate);
                const handleInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
                window.addEventListener('beforeinstallprompt', handleInstallPrompt);
                return () => { window.removeEventListener('storage', handleStorage); window.removeEventListener('gwt-stats-updated', handleStatsUpdate); window.removeEventListener('beforeinstallprompt', handleInstallPrompt); };
            }, []);

            useEffect(() => { darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark'); }, [darkMode]);

            const installApp = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { setDeferredPrompt(null); setShowInstall(false); } };
            const NavItem = ({ id, icon, label, isAction = false, onClick = null }) => { 
                if (isAction) { 
                    return (<button onClick={onClick} className="flex-shrink-0 min-w-[4.5rem] flex flex-col items-center gap-1 p-2 rounded-xl transition-all text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/10"><div className="p-2 rounded-full"><Icon name={icon} size={24} /></div><span className="text-[10px] font-bold">{label}</span></button>); 
                } 
                return (<button onClick={() => setView(id)} className={`flex-shrink-0 min-w-[4.5rem] flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${view === id ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'}`}><div className={`p-2 rounded-full transition-all ${view === id ? 'bg-brand-50 dark:bg-brand-900/20' : ''}`}><Icon name={icon} size={24} /></div><span className="text-[10px] font-bold">{label}</span></button>); 
            };

            return (
                <DialogProvider>
                    <div className="min-h-screen pb-24 md:pb-0 md:pl-24 flex flex-col">
                        <nav className="hidden md:flex fixed left-0 top-0 h-screen w-24 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex-col z-50">
                            <div className="flex justify-center w-full py-6 shrink-0"><div className="w-12 h-12 bg-brand-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-600/30">GW</div></div>
                            <div className="flex-1 overflow-y-auto w-full px-2 flex flex-col items-center gap-3 no-scrollbar py-2"><NavItem id="home" icon="home" label="Inicio" /><NavItem id="tuner" icon="mic" label="Afinar" /><NavItem id="tracks" icon="music" label="Pistas" /><NavItem id="metronome" icon="activity" label="Tempo" /><NavItem id="pads" icon="layers" label="Pads" /><NavItem id="looper" icon="repeat" label="Looper" /><NavItem id="recorder" icon="mic" label="Ideas" /><NavItem id="routine" icon="zap" label="Rutinas" /><NavItem id="scales" icon="grid" label="Escalas" /><NavItem id="ear" icon="ear" label="Oído" /><NavItem id="analyze" icon="analyze" label="Teoría" />{showInstall && <div className="w-full border-t border-slate-100 dark:border-slate-800 my-2"></div>}{showInstall && <NavItem id="install" icon="download" label="Instalar" isAction={true} onClick={installApp} />}</div>
                            <div className="flex justify-center w-full py-6 shrink-0"><button onClick={() => setDarkMode(!darkMode)} className="p-3 bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-600 dark:text-slate-400 rounded-full transition-all hover:scale-110 shadow-sm border border-slate-200 dark:border-slate-700" title="Modo Oscuro/Claro"><Icon name={darkMode ? "sun" : "moon"} size={22} /></button></div>
                        </nav>
                        
                        <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 z-50 px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar safe-area-pb">
                            <NavItem id="home" icon="home" label="Inicio" />
                            <NavItem id="tuner" icon="mic" label="Afinar" />
                            <NavItem id="tracks" icon="music" label="Pistas" />
                            <NavItem id="metronome" icon="activity" label="Tempo" />
                            <NavItem id="pads" icon="layers" label="Pads" />
                            <NavItem id="looper" icon="repeat" label="Loop" />
                            <NavItem id="recorder" icon="mic" label="Ideas" />
                            <NavItem id="routine" icon="zap" label="Rutinas" />
                            <NavItem id="scales" icon="grid" label="Escalas" />
                            <NavItem id="ear" icon="ear" label="Oído" />
                            <NavItem id="analyze" icon="analyze" label="Teoría" />
                            {showInstall && <div className="h-8 w-[1px] bg-slate-200 dark:bg-slate-700 mx-2 shrink-0"></div>}
                            {showInstall && <NavItem id="install" icon="download" label="App" isAction={true} onClick={installApp} />}
                        </nav>

                        <main className="max-w-5xl mx-auto p-4 md:p-12 pb-32 animate-fade-in flex-grow w-full">
                            <div className="flex justify-end md:hidden mb-6"><button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-white dark:bg-slate-800 rounded-full shadow-sm text-slate-500"><Icon name={darkMode ? "sun" : "moon"} size={20} /></button></div>
                            
                            {padEngine.isPlaying && view !== 'pads' && (
                                <div onClick={() => setView('pads')} className="fixed bottom-24 right-4 md:bottom-8 md:right-8 bg-indigo-600 text-white p-3 rounded-full shadow-2xl z-[60] cursor-pointer animate-pulse-ring flex items-center justify-center">
                                    <Icon name="layers" size={24} />
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{padEngine.activeKey}</span>
                                </div>
                            )}

                            {view === 'home' && (
                                <div className="space-y-8 py-8">
                                    <div className="text-center space-y-4"><h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 dark:text-white tracking-tight">Guitar <span className="text-brand-600">Worship</span> Trainer</h1><p className="text-slate-500 dark:text-slate-400 max-w-lg mx-auto text-lg">Tu compañero de ensayo todo en uno.</p><div className="max-w-md mx-auto mt-6"><ProgressStats key={updateTrigger} /></div></div>
                                    <div><h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Herramientas</h3><div className="grid grid-cols-2 md:grid-cols-3 gap-4"><div onClick={() => setView('tuner')} className="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-2xl shadow-xl shadow-indigo-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="mic" size={24} /></div><h3 className="font-bold text-lg">Afinador</h3><p className="text-xs opacity-90 mt-1">Cromático</p></div><div onClick={() => setView('tracks')} className="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-2xl shadow-xl shadow-indigo-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="music" size={24} /></div><h3 className="font-bold text-lg">Pistas & Songs</h3><p className="text-xs opacity-90 mt-1">Player y Letras</p></div><div onClick={() => setView('metronome')} className="bg-gradient-to-br from-rose-500 to-orange-500 p-6 rounded-2xl shadow-xl shadow-rose-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="activity" size={24} /></div><h3 className="font-bold text-lg">Metrónomo</h3><p className="text-xs opacity-90 mt-1">Speed Trainer</p></div><div onClick={() => setView('pads')} className="bg-gradient-to-br from-blue-500 to-indigo-600 p-6 rounded-2xl shadow-xl shadow-blue-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="layers" size={24} /></div><h3 className="font-bold text-lg">Worship Pads</h3><p className="text-xs opacity-90 mt-1">Ambiente continuo</p></div><div onClick={() => setView('looper')} className="bg-gradient-to-br from-teal-500 to-emerald-600 p-6 rounded-2xl shadow-xl shadow-teal-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="repeat" size={24} /></div><h3 className="font-bold text-lg">Jam Looper</h3><p className="text-xs opacity-90 mt-1">Graba & Toca encima</p></div><div onClick={() => setView('recorder')} className="bg-gradient-to-br from-red-500 to-pink-600 p-6 rounded-2xl shadow-xl shadow-red-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="mic" size={24} /></div><h3 className="font-bold text-lg">Grabadora</h3><p className="text-xs opacity-90 mt-1">Ideas & Riffs</p></div></div></div>
                                    <div><h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Entrenamiento</h3><div className="grid grid-cols-2 md:grid-cols-3 gap-4"><div onClick={() => setView('routine')} className="bg-gradient-to-br from-amber-500 to-yellow-600 p-6 rounded-2xl shadow-xl shadow-amber-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="zap" size={24} /></div><h3 className="font-bold text-lg">Rutinas</h3><p className="text-xs opacity-90 mt-1">Eléctrica</p></div><div onClick={() => setView('scales')} className="bg-gradient-to-br from-emerald-500 to-teal-600 p-6 rounded-2xl shadow-xl shadow-emerald-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="grid" size={24} /></div><h3 className="font-bold text-lg">Escalas</h3><p className="text-xs opacity-90 mt-1">Mástil & Tríadas</p></div><div onClick={() => setView('ear')} className="bg-gradient-to-br from-fuchsia-500 to-pink-600 p-6 rounded-2xl shadow-xl shadow-fuchsia-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="ear" size={24} /></div><h3 className="font-bold text-lg">Oído</h3><p className="text-xs opacity-90 mt-1">Entrenador</p></div></div></div>
                                    <div><h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Conocimiento</h3><div className="grid grid-cols-2 md:grid-cols-3 gap-4"><div onClick={() => setView('analyze')} className="bg-gradient-to-br from-violet-500 to-fuchsia-600 p-6 rounded-2xl shadow-xl shadow-violet-500/20 cursor-pointer hover:scale-[1.02] transition-transform text-white"><div className="mb-3 opacity-80"><Icon name="analyze" size={24} /></div><h3 className="font-bold text-lg">Teoría</h3><p className="text-xs opacity-90 mt-1">Analizador</p></div></div></div>
                                </div>
                            )}
                            {view === 'tuner' && <Tuner />}
                            {view === 'tracks' && <TrackTrainer />}
                            {view === 'metronome' && <Metronome />}
                            {view === 'routine' && <PracticeRoutine />}
                            {view === 'analyze' && <TheoryHub />}
                            {view === 'scales' && <ScaleStudio />}
                            {view === 'ear' && <EarTrainer />}
                            {view === 'recorder' && <IdeaRecorder />}
                            {view === 'looper' && <JamLooper />}
                            {view === 'pads' && <PadPlayer engine={padEngine} />}
                        </main>
                        <Footer />
                    </div>
                </DialogProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
