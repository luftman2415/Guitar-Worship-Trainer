         const CircleOfFifths = () => { const [selectedKey, setSelectedKey] = useState('C'); const WHEEL_ITEMS = [{ label: 'C', idx: 0 }, { label: 'G', idx: 1 }, { label: 'D', idx: 2 }, { label: 'A', idx: 3 }, { label: 'E', idx: 4 }, { label: 'B', idx: 5 }, { label: 'Gb', idx: 6 }, { label: 'Db', idx: 7 }, { label: 'Ab', idx: 8 }, { label: 'Eb', idx: 9 }, { label: 'Bb', idx: 10 }, { label: 'F', idx: 11 }]; const getKeyDetails = (root) => { const details = { 'C':  { sub: 'F', subMin: 'Dm', dom: 'G', domMin: 'Em', min: 'Am', sharps: '0' }, 'G':  { sub: 'C', subMin: 'Am', dom: 'D', domMin: 'Bm', min: 'Em', sharps: '1 ♯' }, 'D':  { sub: 'G', subMin: 'Em', dom: 'A', domMin: 'F#m', min: 'Bm', sharps: '2 ♯' }, 'A':  { sub: 'D', subMin: 'Bm', dom: 'E', domMin: 'C#m', min: 'F#m', sharps: '3 ♯' }, 'E':  { sub: 'A', subMin: 'F#m', dom: 'B', domMin: 'G#m', min: 'C#m', sharps: '4 ♯' }, 'B':  { sub: 'E', subMin: 'C#m', dom: 'F#', domMin: 'D#m', min: 'G#m', sharps: '5 ♯' }, 'F#': { sub: 'B', subMin: 'G#m', dom: 'C#', domMin: 'A#m', min: 'D#m', sharps: '6 ♯' }, 'Gb': { sub: 'Cb', subMin: 'Abm', dom: 'Db', domMin: 'Bbm', min: 'Ebm', sharps: '6 ♭', flat: true }, 'Db': { sub: 'Gb', subMin: 'Ebm', dom: 'Ab', domMin: 'Fm', min: 'Bbm', sharps: '5 ♭', flat: true }, 'Ab': { sub: 'Db', subMin: 'Bbm', dom: 'Eb', domMin: 'Cm', min: 'Fm', sharps: '4 ♭', flat: true }, 'Eb': { sub: 'Ab', subMin: 'Fm', dom: 'Bb', domMin: 'Gm', min: 'Cm', sharps: '3 ♭', flat: true }, 'Bb': { sub: 'Eb', subMin: 'Cm', dom: 'F', domMin: 'Dm', min: 'Gm', sharps: '2 ♭', flat: true }, 'F':  { sub: 'Bb', subMin: 'Gm', dom: 'C', domMin: 'Am', min: 'Dm', sharps: '1 ♭', flat: true } }; return details[root] || details['C']; }; const current = getKeyDetails(selectedKey); const currentItem = WHEEL_ITEMS.find(item => item.label === selectedKey); const rotation = -30 * (currentItem ? currentItem.idx : (selectedKey === 'F#' ? 6 : 0)); return (<div className="animate-fade-in flex flex-col items-center"><div className="relative w-80 h-80 mb-8 mt-4"><div className="w-full h-full rounded-full relative wheel-transition" style={{ transform: `rotate(${rotation}deg)` }}>{WHEEL_ITEMS.map((k, i) => { const angle = 30 * i; const isSelected = k.label === selectedKey || (k.label === 'Gb' && selectedKey === 'F#'); const minKey = getKeyDetails(k.label).min; return (<div key={i} className="absolute w-full h-full left-0 top-0 pointer-events-none" style={{ transform: `rotate(${angle}deg)` }}><div onClick={(e) => { e.stopPropagation(); setSelectedKey(k.label); }} className={`pointer-events-auto cursor-pointer absolute left-1/2 -ml-[40px] top-0 w-[80px] h-[160px] flex flex-col items-center pt-2 transition-opacity ${isSelected ? 'opacity-100' : 'opacity-60 hover:opacity-80'}`}><span className={`text-lg font-bold ${isSelected ? 'text-brand-600 scale-125' : 'text-slate-800 dark:text-slate-200'} transition-transform bg-white/80 dark:bg-slate-900/80 px-2 rounded-lg`}>{k.label === 'Gb' ? 'Gb/F#' : k.label}</span><span className="text-xs font-medium text-slate-500 mt-1 bg-white/80 dark:bg-slate-900/80 px-1 rounded">{k.label === 'Gb' ? 'Ebm/D#m' : minKey}</span></div></div>); })}<div className="absolute inset-0 m-auto w-40 h-40 rounded-full border-4 border-slate-200 dark:border-slate-700 pointer-events-none"></div></div><div className="absolute top-[-10px] left-1/2 -ml-3 w-6 h-6 text-brand-500 z-10"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-18h24z"/></svg></div></div><div className="w-full max-w-lg grid grid-cols-3 gap-3 text-center"><div className="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700"><div className="text-[10px] font-bold text-slate-400 uppercase">Subdominante (IV)</div><div className="text-xl font-bold text-slate-700 dark:text-slate-200">{current.sub}</div><div className="text-xs text-slate-400">{current.subMin}</div></div><div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl shadow-md border border-brand-200 dark:border-brand-800 scale-110 z-10 relative group"><div className="text-[10px] font-bold text-brand-500 uppercase">Tónica (I)</div><div className="text-3xl font-black text-brand-600 dark:text-white">{selectedKey}</div><div className="text-sm font-bold text-slate-500 dark:text-slate-300">Relativa: {current.min}</div><div className="mt-1 text-xs bg-white dark:bg-slate-800 inline-block px-2 py-0.5 rounded-full text-slate-500">{current.sharps}</div>{(selectedKey === 'Gb' || selectedKey === 'F#') && (<div className="absolute -bottom-8 left-0 right-0 text-center"><button onClick={(e) => {e.stopPropagation(); setSelectedKey(prev => prev === 'Gb' ? 'F#' : 'Gb');}} className="text-[10px] text-brand-500 underline bg-white/50 dark:bg-slate-900/50 px-2 py-1 rounded">Ver como {selectedKey === 'Gb' ? 'F#' : 'Gb'}</button></div>)}</div><div className="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700"><div className="text-[10px] font-bold text-slate-400 uppercase">Dominante (V)</div><div className="text-xl font-bold text-slate-700 dark:text-slate-200">{current.dom}</div><div className="text-xs text-slate-400">{current.domMin}</div></div></div><p className="mt-8 text-slate-400 text-center text-xs max-w-xs">Usa el Círculo de Quintas para componer progresiones, modular a otras tonalidades o encontrar las notas alteradas de una escala.</p></div>); };

         
         // --- HERRAMIENTAS DE TEORÍA ---
const ChordAnalyzer = () => { 
            const [input, setInput] = useState(''); const [analysis, setAnalysis] = useState(null); 
            
            const normalizeChord = (chordStr) => { 
                if(!chordStr) return null; 
                let c = chordStr.trim(); c = c.charAt(0).toUpperCase() + c.slice(1); 
                const match = c.match(/^([A-G][#b]?)(.*)$/i); 
                if (!match) return null; 
                let root = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase(); 
                let quality = match[2].toLowerCase(); 
                const flatMap = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' }; 
                if (flatMap[root]) root = flatMap[root]; 
                return { root, quality, original: c }; 
            }; 
            
            const analyzeChords = () => { 
                if (!input.trim()) return; 
                const rawChords = input.split(/[\s,-]+/).filter(c => c); 
                const chords = rawChords.map(normalizeChord).filter(c => c); 
                if (chords.length === 0) { setAnalysis({ error: "No se reconocieron acordes. Intenta usar notación americana (C, D, Em...)" }); return; } 
                
                let bestKey = null; let maxScore = -999; 
                const majorScaleIntervals = [0, 2, 4, 5, 7, 9, 11]; 
                const expectedQualities = ['', 'm', 'm', '', '', 'm', 'dim']; // Grados: I, ii, iii, IV, V, vi, vii°
                const romanNumerals = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];
                
                NOTES.forEach((keyRoot, keyIndex) => { 
                    let score = 0; 
                    const scaleNotesIndices = majorScaleIntervals.map(i => (keyIndex + i) % 12); 
                    const degrees =[]; 
                    
                    chords.forEach(chord => { 
                        const rootIndex = NOTES.indexOf(chord.root); 
                        if (rootIndex === -1) { score -= 10; degrees.push({ chord: chord.original, degree: '?', func: 'Error' }); return; } 
                        
                        const degreeIndex = scaleNotesIndices.indexOf(rootIndex);
                        if (degreeIndex !== -1) { 
                            let basicQuality = '';
                            if (chord.quality.includes('m') && !chord.quality.includes('maj')) basicQuality = 'm';
                            if (chord.quality.includes('dim')) basicQuality = 'dim';

                            // Si la nota Y la cualidad coinciden perfectamente
                            if (basicQuality === expectedQualities[degreeIndex]) {
                                score += 2; 
                                degrees.push({ chord: chord.original, degree: romanNumerals[degreeIndex], func: 'Diatónico' }); 
                            } else {
                                // La nota raíz está en la escala, pero tiene distinta cualidad (Acorde prestado o alterado)
                                score += 0.5; 
                                let numeral = romanNumerals[degreeIndex];
                                if (basicQuality === '') numeral = numeral.toUpperCase();
                                else if (basicQuality === 'm') numeral = numeral.toLowerCase();
                                degrees.push({ chord: chord.original, degree: numeral, func: 'Intercambio / Alterado' }); 
                            }
                        } else { 
                            // La nota raíz ni siquiera está en la escala
                            score -= 1; degrees.push({ chord: chord.original, degree: '?', func: 'Cromático' }); 
                        } 
                    }); 
                    
                    if (score > maxScore) { maxScore = score; bestKey = { root: keyRoot, type: 'Mayor', degrees }; } 
                }); 
                if(bestKey) setAnalysis(bestKey); 
            }; 
            
            return (<div className="space-y-6 animate-fade-in"><div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 text-center"><p className="text-slate-500 dark:text-slate-400 mb-6 max-w-md mx-auto text-sm">Descubre la tonalidad de tu canción ingresando los acordes.</p><div className="flex flex-col sm:flex-row gap-2 mb-6"><input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && analyzeChords()} placeholder="Ej: G D Em C" className="flex-1 p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-violet-500 dark:text-white font-mono text-lg"/><button onClick={analyzeChords} className="bg-violet-600 hover:bg-violet-700 text-white px-6 py-3 sm:py-0 rounded-xl font-bold transition-colors w-full sm:w-auto">Analizar</button></div>{analysis && !analysis.error && (<div className="bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 text-left animate-fade-in"><div className="flex justify-between items-start border-b border-slate-200 dark:border-slate-700 pb-4 mb-4"><div><p className="text-xs font-bold text-slate-500 uppercase tracking-widest">Tonalidad Detectada</p><h3 className="text-3xl font-black text-slate-800 dark:text-white">{analysis.root} <span className="text-violet-500">{analysis.type}</span></h3></div></div><div className="grid grid-cols-2 sm:grid-cols-4 gap-4">{analysis.degrees.map((d, i) => (<div key={i} className="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 text-center"><div className="text-xl font-bold dark:text-white mb-1">{d.chord}</div><div className={`inline-block px-2 py-0.5 rounded text-xs font-bold mb-1 ${d.func === 'Diatónico' ? 'bg-violet-100 text-violet-700 dark:bg-violet-900/30 dark:text-violet-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'}`} title={d.func}>{d.degree}</div></div>))}</div></div>)}{analysis?.error && (<div className="p-4 bg-red-100 text-red-600 rounded-xl font-bold text-sm">{analysis.error}</div>)}</div></div>); 
        };        


        
const DelayCalculator = () => {
            const[bpm, setBpm] = useState(70);
            const quarter = Math.round(60000 / bpm); const dottedEighth = Math.round(quarter * 0.75); const eighth = Math.round(quarter / 2);
            return (
                <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-md mx-auto animate-fade-in text-center">
                    <div className="w-16 h-16 bg-cyan-100 dark:bg-cyan-900/30 text-cyan-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="clock" size={32} /></div>
                    <h2 className="text-2xl font-bold mb-2 dark:text-white">Calculadora de Delay</h2>
                    <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm">Ajusta los ms de tu pedalera al tempo exacto.</p>
                    <div className="bg-slate-50 dark:bg-slate-900 p-6 rounded-2xl mb-8">
                        <div className="text-5xl font-black text-slate-800 dark:text-white mb-2">{bpm} <span className="text-lg text-slate-400 font-bold">BPM</span></div>
                        <input type="range" min="40" max="200" value={bpm} onChange={(e) => setBpm(Number(e.target.value))} className="w-full h-2 bg-slate-200 rounded-full appearance-none cursor-pointer dark:bg-slate-700 accent-cyan-500"/>
                        <div className="flex gap-4 justify-center mt-4"><button onClick={() => setBpm(b => Math.max(40, b - 1))} className="w-10 h-10 bg-white dark:bg-slate-800 rounded-xl shadow font-bold text-slate-600 dark:text-white active:scale-95">-</button><button onClick={() => setBpm(b => Math.min(200, b + 1))} className="w-10 h-10 bg-white dark:bg-slate-800 rounded-xl shadow font-bold text-slate-600 dark:text-white active:scale-95">+</button></div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="col-span-2 bg-cyan-50 dark:bg-cyan-900/20 p-4 rounded-xl border border-cyan-200 dark:border-cyan-800 shadow-sm relative overflow-hidden"><div className="absolute -right-4 -top-4 opacity-10"><Icon name="activity" size={80}/></div><p className="text-xs font-bold text-cyan-600 dark:text-cyan-400 uppercase tracking-widest mb-1">Corchea con Puntillo</p><div className="text-4xl font-black text-cyan-700 dark:text-white">{dottedEighth} <span className="text-sm font-bold text-cyan-500">ms</span></div><p className="text-[10px] font-medium text-cyan-600/70 dark:text-cyan-400/70 mt-1">El sonido clásico de guitarra Worship</p></div>
                        <div className="bg-white dark:bg-slate-700 p-4 rounded-xl border border-slate-100 dark:border-slate-600 shadow-sm"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Negra</p><div className="text-xl font-bold text-slate-700 dark:text-white">{quarter} ms</div></div>
                        <div className="bg-white dark:bg-slate-700 p-4 rounded-xl border border-slate-100 dark:border-slate-600 shadow-sm"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Corchea</p><div className="text-xl font-bold text-slate-700 dark:text-white">{eighth} ms</div></div>
                    </div>
                </div>
            );
        };

     
      const CapoCalculator = () => {
            const[originalKey, setOriginalKey] = useState('C');
            const [targetShape, setTargetShape] = useState('G');
            const [progression, setProgression] = useState('');
            
            // Lista extendida para facilitar cálculos
            const KEYS =["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
            
            const calculateCapo = () => {
                const oIndex = KEYS.indexOf(originalKey);
                const tIndex = KEYS.indexOf(targetShape);
                let diff = oIndex - tIndex;
                if (diff < 0) diff += 12;
                return diff;
            };
            const capoPos = calculateCapo();

            // Lógica inteligente para transponer tolerando minúsculas
            const transposeChord = (chord, diff) => {
                const match = chord.match(/^([a-gA-G][#b]?)(.*)$/);
                if (!match) return chord;
                // Forzamos a que la raíz (C, D, E) sea siempre mayúscula y sostenidos/bemoles correctos
                let root = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase(); 
                let rest = match[2]; // El resto (m, sus4, maj7) se queda igual
                
                const flatMap = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
                let searchRoot = flatMap[root] || root;
                let rootIdx = KEYS.indexOf(searchRoot);
                if (rootIdx === -1) return chord;
                let newIdx = (rootIdx + diff) % 12;
                if (newIdx < 0) newIdx += 12;
                return KEYS[newIdx] + rest;
            };

            const getTransposedText = () => {
                if (!progression) return '';
                const oIndex = KEYS.indexOf(originalKey);
                const tIndex = KEYS.indexOf(targetShape);
                let diff = tIndex - oIndex; // Transposición invertida para saber qué tocar con Capo
                
                // Dividimos el texto respetando los espacios, guiones y saltos de línea
                const tokens = progression.split(/([\s\n-]+)/);
                return tokens.map((token) => {
                    // Validamos si la palabra parece un acorde (agregamos 'i' al final para que ignore mayúsculas/minúsculas)
                    if (/^[A-G][#b]?(m|dim|aug|sus\d|add\d|maj\d|\d)*$/i.test(token)) {
                        return transposeChord(token, diff);
                    }
                    return token;
                }).join('');
            };

            return (
                <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-md mx-auto animate-fade-in text-center">
                    <h2 className="text-2xl font-bold mb-6 dark:text-white">Calculadora de Capo</h2>
                    <div className="flex gap-4 mb-8">
                        <div className="flex-1">
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Tono Original</label>
                            <select value={originalKey} onChange={e => setOriginalKey(e.target.value)} className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-bold text-lg dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500 text-center appearance-none">
                                {KEYS.map(k => <option key={k} value={k}>{k}</option>)}
                            </select>
                        </div>
                        <div className="flex items-center justify-center pt-6 text-slate-300"><Icon name="arrowLeft" size={24} className="rotate-180"/></div>
                        <div className="flex-1">
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Quiero tocar en</label>
                            <select value={targetShape} onChange={e => setTargetShape(e.target.value)} className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-bold text-lg dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500 text-center appearance-none">
                                {KEYS.map(k => <option key={k} value={k}>{k}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <div className="bg-brand-50 dark:bg-brand-900/20 p-6 rounded-2xl border border-brand-100 dark:border-brand-800 mb-8">
                        <p className="text-xs font-bold text-brand-600 dark:text-brand-400 uppercase tracking-widest mb-2">Coloca el Capo en</p>
                        <div className="text-6xl font-black text-brand-600 dark:text-white mb-2">{capoPos === 0 ? '0' : capoPos}</div>
                        <p className="text-sm text-slate-500 dark:text-slate-400 font-medium">
                            {capoPos === 0 ? 'Sin Capo' : `Traste ${capoPos}`}
                        </p>
                    </div>

                    <div className="text-left border-t border-slate-100 dark:border-slate-700 pt-6">
                        <label className="text-xs font-bold text-slate-500 uppercase flex items-center gap-2 mb-3"><Icon name="edit" size={14}/> Transponer Progresión</label>
                        <textarea 
                            value={progression} 
                            onChange={(e) => setProgression(e.target.value)} 
                            placeholder="Pega o escribe los acordes aquí (Ej: f c g am)" 
                            className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-mono text-sm dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500 mb-4 resize-none h-24"
                        ></textarea>
                        
                        <div className="relative p-5 bg-gradient-to-br from-brand-600 to-indigo-700 text-white rounded-2xl shadow-lg shadow-brand-500/30 min-h-[6rem] overflow-hidden">
                            <p className="text-[10px] font-bold uppercase tracking-widest mb-2 text-brand-200">Acordes a tocar (Con Capo)</p>
                            <pre className="font-mono text-lg font-bold whitespace-pre-wrap">{getTransposedText() || '...'}</pre>
                            <div className="absolute -right-4 -bottom-4 opacity-10 rotate-12 scale-150 pointer-events-none"><Icon name="music" size={80}/></div>
                        </div>
                    </div>
                </div>
            );
        };

        const NashvilleTranslator = () => {
            const[key, setKey] = useState('C'); const[input, setInput] = useState('');
            const majorScale =[0, 2, 4, 5, 7, 9, 11]; const degrees =['1', '2m', '3m', '4', '5', '6m', '7dim'];
            const translate = () => {
                if(!input.trim()) return '';
                const rootIdx = NOTES.indexOf(key);
                const scaleNotes = majorScale.map(i => NOTES[(rootIdx + i) % 12]);
                const tokens = input.split(/[\s,-]+/);
                return tokens.map(token => {
                    if (!token) return '';
                    const numMatch = token.match(/^([1-7])(m|dim)?(.*)$/i);
                    if (numMatch) {
                        const degree = parseInt(numMatch[1]) - 1; let chord = scaleNotes[degree]; let quality = numMatch[2] ? numMatch[2].toLowerCase() : '';
                        if(quality==='' &&['2m','3m','6m'].includes(degrees[degree])) quality='m';
                        if(quality==='' && degree===6) quality='dim';
                        return chord + quality + (numMatch[3]||'');
                    }
                    const chordMatch = token.match(/^([a-gA-G][#b]?)(m|dim)?(.*)$/i);
                    if (chordMatch) {
                        let chordRoot = chordMatch[1].charAt(0).toUpperCase() + chordMatch[1].slice(1).toLowerCase();
                        const flatMap = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
                        if (flatMap[chordRoot]) chordRoot = flatMap[chordRoot];
                        const idx = scaleNotes.indexOf(chordRoot);
                        if(idx !== -1) return (idx+1) + (chordMatch[2] ? chordMatch[2].toLowerCase() : (degrees[idx].includes('m')?'m':'')) + (chordMatch[3]||'');
                    }
                    return token;
                }).join(' - ');
            };
            return (
                <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-md mx-auto animate-fade-in text-center">
                    <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="file" size={32} /></div>
                    <h2 className="text-2xl font-bold mb-2 dark:text-white">Sistema Nashville</h2>
                    <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm">Traduce entre Acordes y Números (Ej: 1, 4, 5)</p>
                    <div className="mb-6 text-left"><label className="text-xs font-bold text-slate-500 uppercase mb-2 block">Tono de la canción</label><select value={key} onChange={e=>setKey(e.target.value)} className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-bold text-lg dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">{NOTES.map(n=><option key={n} value={n}>{n}</option>)}</select></div>
                    <div className="text-left mb-6"><label className="text-xs font-bold text-slate-500 uppercase mb-2 block">Ingresa Acordes o Números</label><input type="text" placeholder="Ej: c f g am o 1 4 5 6m" value={input} onChange={e=>setInput(e.target.value)} className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-mono text-lg dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500"/></div>
                    <div className="bg-blue-50 dark:bg-blue-900/20 p-6 rounded-2xl border border-blue-100 dark:border-blue-800 min-h-[100px] flex flex-col justify-center"><p className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest mb-2">Traducción</p><div className="text-2xl font-black text-blue-700 dark:text-white font-mono tracking-widest">{translate() || '...'}</div></div>
                </div>
            );
        };

        const CHORD_SYSTEM = {
            'Mayor': [{ rs: 0, frets:[0, 2, 2, 1, 0, 0] }, { rs: 1, frets:['x', 0, 2, 2, 2, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 3, 2] }, { rs: 1, frets:['x', 0, -1, -3, -2, -3] }, { rs: 0, frets: [0, -1, -3, -3, -3, 0] }],
            'Menor': [{ rs: 0, frets:[0, 2, 2, 0, 0, 0] }, { rs: 1, frets:['x', 0, 2, 2, 1, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 3, 1] }],
            '7':[{ rs: 0, frets:[0, 2, 0, 1, 3, 0] }, { rs: 1, frets:['x', 0, 2, 0, 2, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 1, 2] }, { rs: 1, frets:['x', 0, -1, -3, -2, 0] }, { rs: 0, frets:[0, -1, -3, -3, -3, -2] }],
            'm7':[{ rs: 0, frets:[0, 2, 0, 0, 0, 0] }, { rs: 1, frets:['x', 0, 2, 0, 1, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 1, 1] }],
            'Maj7':[{ rs: 0, frets: [0, 2, 1, 1, 0, 0] }, { rs: 1, frets:['x', 0, 2, 1, 2, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 2, 2] }, { rs: 1, frets:['x', 0, -1, -3, -3, -3] }],
            'sus4':[{ rs: 0, frets:[0, 2, 2, 2, 0, 0] }, { rs: 1, frets:['x', 0, 2, 2, 3, 0] }, { rs: 2, frets: ['x', 'x', 0, 2, 3, 3] }, { rs: 1, frets:['x', 0, 0, -3, -2, -2] }],
            'sus2':[{ rs: 1, frets:['x', 0, 2, 2, 0, 0] }, { rs: 2, frets:['x', 'x', 0, 2, 3, 0] }, { rs: 1, frets:['x', 0, -3, -3, -2, -3] }, { rs: 0, frets:[0, 2, 4, 4, 0, 0] }],
            'add9':[{ rs: 1, frets:['x', 0, -1, -3, 0, 0] }, { rs: 0, frets:[0, -1, -3, -1, -3, 0] }, { rs: 0, frets:[0, 2, 4, 1, 0, 0] }, { rs: 1, frets:['x', 0, 2, 4, 2, 0] }],
            'dim':[{ rs: 0, frets:[0, 1, 2, 0, 'x', 'x'] }, { rs: 1, frets:['x', 0, 1, 2, 1, 'x'] }, { rs: 2, frets:['x', 'x', 0, 1, 3, 1] }],
            'aug': [{ rs: 0, frets:[0, 3, 2, 1, 1, 0] }, { rs: 1, frets:['x', 0, 3, 2, 2, 1] }, { rs: 2, frets:['x', 'x', 0, 3, 3, 2] }]
        };

        const ChordDictionary = () => {
            const [selectedRoot, setSelectedRoot] = useState('C');
            const [selectedType, setSelectedType] = useState('Mayor');
            const TYPES =['Mayor', 'Menor', '7', 'm7', 'Maj7', 'sus4', 'sus2', 'add9', 'dim', 'aug'];
            const OPEN_NOTES =[4, 9, 2, 7, 11, 4]; 
            const INT_NAMES = {0:'1', 1:'b2', 2:'2', 3:'b3', 4:'3', 5:'4', 6:'b5', 7:'5', 8:'b6', 9:'6', 10:'b7', 11:'7'};

            const getChords = () => {
                const rootIndex = NOTES.indexOf(selectedRoot);
                const shapes = CHORD_SYSTEM[selectedType] ||[];
                const generated = new Array();
                const seen = new Set();
                
                shapes.forEach(shape => {
                    const openNote = OPEN_NOTES[shape.rs];
                    const rootFret = (rootIndex - openNote + 12) % 12;

                    [rootFret, rootFret + 12].forEach(rf => {
                        if (rf > 14) return;
                        let isValid = true;
                        const actualFrets = new Array();
                        const muted =[false, false, false, false, false, false];
                        
                        shape.frets.forEach((offset, sIdx) => {
                            if (offset === 'x') { muted[sIdx] = true; actualFrets.push(-1); } 
                            else { const fret = rf + offset; if (fret < 0 || fret > 17) isValid = false; actualFrets.push(fret); }
                        });
                        if (!isValid) return;

                        const frettedOnly = actualFrets.filter(f => f > 0);
                        if (frettedOnly.length > 0) {
                            const minFret = Math.min(...frettedOnly); const maxFret = Math.max(...frettedOnly);
                            if (maxFret - minFret > 4) return; 
                        }

                        const fretString = actualFrets.join(',');
                        if (seen.has(fretString)) return;
                        seen.add(fretString);

                        let baseFret = frettedOnly.length > 0 ? Math.min(...frettedOnly) : 1;
                        if (actualFrets.some(f => f === 0) || baseFret === 0) baseFret = 1;

                        let puntosAcorde = new Array();
                        actualFrets.forEach((fret, sIdx) => {
                            if (fret >= 0) {
                                const absoluteNote = (OPEN_NOTES[sIdx] + fret) % 12;
                                const diff = (absoluteNote - rootIndex + 12) % 12;
                                let lbl = INT_NAMES[diff];
                                if(selectedType==='add9' && diff===2) lbl='9';
                                if(selectedType==='Maj7' && diff===11) lbl='7M';
                                if(selectedType==='sus4' && diff===5) lbl='4';
                                if(selectedType==='sus2' && diff===2) lbl='2';
                                
                                const isRoot = (sIdx === shape.rs && fret === rf);
                                puntosAcorde.push({ string: sIdx, fret: fret === 0 ? 0 : (fret - baseFret + 1), type: isRoot ? 'root' : 'note', label: isRoot ? 'R' : lbl });
                            }
                        });

                        generated.push({ name: `${selectedRoot}${selectedType === 'Mayor' ? '' : selectedType === 'Menor' ? 'm' : selectedType}`, muted: muted, baseFret: baseFret, dots: puntosAcorde, sortScore: baseFret + (actualFrets.includes(0) ? -10 : 0) });
                    });
                });
                return generated.sort((a, b) => a.sortScore - b.sortScore).slice(0, 4);
            };

            const voicings = getChords();
            return (
                <div className="animate-fade-in text-center max-w-2xl mx-auto">
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 mb-6">
                        <div className="flex flex-col gap-6 mb-2">
                            <div><label className="text-xs font-bold text-slate-500 uppercase block mb-3">Nota Raíz</label><div className="flex flex-wrap gap-2 justify-center">{NOTES.map(n => (<button key={n} onClick={() => setSelectedRoot(n)} className={`w-10 h-10 rounded-xl font-bold transition-all ${selectedRoot === n ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/30 scale-110' : 'bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600'}`}>{n}</button>))}</div></div>
                            <div className="h-px w-full bg-slate-100 dark:bg-slate-700"></div>
                            <div><label className="text-xs font-bold text-slate-500 uppercase block mb-3">Tipo de Acorde</label><div className="flex flex-wrap gap-2 justify-center">{TYPES.map(t => (<button key={t} onClick={() => setSelectedType(t)} className={`px-4 py-2 rounded-xl font-bold transition-all text-sm ${selectedType === t ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/30' : 'bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600'}`}>{t === 'Mayor' ? 'May' : t === 'Menor' ? 'm' : t}</button>))}</div></div>
                        </div>
                    </div>
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700"><h3 className="text-lg font-bold mb-6 dark:text-white">Posiciones: <span className="text-brand-600">{selectedRoot}{selectedType === 'Mayor' ? '' : selectedType === 'Menor' ? 'm' : selectedType}</span></h3>{voicings.length > 0 ? (<div className="flex flex-wrap justify-center gap-6 sm:gap-12">{voicings.map((v, i) => (<div key={i} className="flex flex-col items-center"><ChordDisplay chord={v} size="medium" /><span className="text-xs text-slate-400 mt-4 font-bold bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full">Posición {i + 1}</span></div>))}</div>) : (<p className="text-sm text-slate-500">No hay posiciones disponibles.</p>)}</div>
                </div>
            );
        };
         
        const TabTransposer = () => {
            const [tabs, setTabs] = useState('');
            const [semitones, setSemitones] = useState(0);
            const [copied, setCopied] = useState(false); // Para mostrar el mensajito de "Copiado"
            const textareaRef = useRef(null);

            const getTransposedTabs = () => {
                if (!tabs) return '';
                if (semitones === 0) return tabs;
                
                const tokens = tabs.split(/(cuerdas?\s*\d+|c\s*\d+|strings?\s*\d+)/gi);
                
                return tokens.map(token => {
                    if (/^(cuerdas?|c|strings?)\s*\d+$/i.test(token)) return token;
                    
                    // ALGORITMO PERFECCIONADO
                    return token.replace(/(\d+)(?=[hpsbrv\s\n\-\|()[\]{}]|$)/gi, (match) => {
                        const newFret = parseInt(match) + semitones;
                        return newFret < 0 ? 'X' : newFret.toString();
                    });
                }).join('');
            };

            const insertAtCursor = (text) => {
                const textarea = textareaRef.current;
                if (!textarea) return;
                const start = textarea.selectionStart; const end = textarea.selectionEnd;
                const before = tabs.substring(0, start); const after = tabs.substring(end);
                const newText = before + text + " " + after;
                setTabs(newText);
                setTimeout(() => { textarea.focus(); textarea.setSelectionRange(start + text.length + 1, start + text.length + 1); }, 0);
            };

            // NUEVAS FUNCIONES DE EXPORTACIÓN
            const downloadTxt = () => {
                const text = getTransposedTabs();
                if (!text) return;
                const element = document.createElement("a");
                const file = new Blob([text], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                // Nombramos el archivo inteligentemente (Ej: Tablatura_+2.txt)
                element.download = `Tablatura_${semitones > 0 ? '+' : ''}${semitones}.txt`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            const copyToClipboard = () => {
                const text = getTransposedTabs();
                if (!text) return;
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000); // Vuelve a la normalidad en 2 segundos
            };

            return (
                <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-2xl mx-auto animate-fade-in text-center">
                    <div className="w-16 h-16 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="tablature" size={32} /></div>
                    <h2 className="text-2xl font-bold mb-2 dark:text-white">Transpositor de Tabs</h2>
                    <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm">Sube o baja de tono tus tablaturas o punteos numéricos.</p>
                    
                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl w-full sm:w-fit mx-auto border border-slate-100 dark:border-slate-700">
                        <div className="flex items-center gap-4">
                            <span className="text-xs font-bold text-slate-500 uppercase">Semitonos:</span>
                            <button onClick={() => setSemitones(s => s - 1)} className="w-10 h-10 bg-white dark:bg-slate-800 rounded-xl shadow font-bold text-slate-600 dark:text-white active:scale-95 hover:text-emerald-500 transition-colors">-</button>
                            <span className="text-3xl font-black text-emerald-600 dark:text-white w-16 text-center">{semitones > 0 ? `+${semitones}` : semitones}</span>
                            <button onClick={() => setSemitones(s => s + 1)} className="w-10 h-10 bg-white dark:bg-slate-800 rounded-xl shadow font-bold text-slate-600 dark:text-white active:scale-95 hover:text-emerald-500 transition-colors">+</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                        <div className="flex flex-col relative">
                            <div className="flex justify-between items-center mb-2">
                                <label className="text-xs font-bold text-slate-500 uppercase flex items-center gap-2"><Icon name="edit" size={14}/> Original</label>
                                <div className="flex gap-2">
                                    <button onClick={() => insertAtCursor('cuerda')} className="px-3 py-1.5 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200 dark:hover:bg-emerald-900/50 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1">
                                        Cuerda
                                    </button>
                                    <button onClick={() => insertAtCursor('traste')} className="px-3 py-1.5 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200 dark:hover:bg-emerald-900/50 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1">
                                        Traste
                                    </button>
                                </div>
                            </div>
                            <textarea 
                                ref={textareaRef}
                                value={tabs} 
                                onChange={(e) => setTabs(e.target.value)} 
                                placeholder="Pega tu tab aquí...&#10;Ej: e|---(8)-[10]---&#10;O usa los botones de arriba" 
                                className="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-xl font-mono text-sm dark:text-white border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-emerald-500 h-48 custom-scrollbar resize-none"
                                spellCheck="false"
                            ></textarea>
                        </div>
                        <div className="flex flex-col">
                            {/* NUEVA BARRA DE HERRAMIENTAS CON BOTONES DE EXPORTACIÓN */}
                            <div className="flex justify-between items-center mb-2 h-[28px]">
                                <label className="text-xs font-bold text-slate-500 uppercase flex items-center gap-2"><Icon name="check" size={14}/> Transpuesta</label>
                                <div className="flex gap-2">
                                    <button onClick={copyToClipboard} className={`px-3 py-1.5 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1 ${copied ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}`}>
                                        <Icon name={copied ? "check" : "file"} size={12}/> {copied ? 'Copiado' : 'Copiar'}
                                    </button>
                                    <button onClick={downloadTxt} className="px-3 py-1.5 bg-emerald-600 text-white hover:bg-emerald-700 text-[10px] sm:text-xs font-bold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1">
                                        <Icon name="download" size={12}/> .TXT
                                    </button>
                                </div>
                            </div>
                            <div className="w-full p-4 bg-emerald-50 dark:bg-emerald-900/20 rounded-xl font-mono text-sm text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 h-48 overflow-y-auto custom-scrollbar whitespace-pre-wrap">
                                {getTransposedTabs() || 'Esperando tabs...'}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };       

        const TheoryHub = () => { 
            const [activeTool, setActiveTool] = useState('dictionary'); 
            return (
                <div className="max-w-5xl mx-auto animate-fade-in">
                    <div className="w-full overflow-x-auto no-scrollbar mb-8 pb-2">
                        <div className="flex sm:justify-center min-w-full px-2">
                            <div className="flex bg-slate-200 dark:bg-slate-800 p-1.5 rounded-2xl shadow-inner mx-auto sm:mx-0 gap-1">
                                <button onClick={() => setActiveTool('dictionary')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'dictionary' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Diccionario</button>
                                <button onClick={() => setActiveTool('nashville')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'nashville' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Nashville (Números)</button>
                                <button onClick={() => setActiveTool('tabs')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'tabs' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Tabs +/-</button>
                                <button onClick={() => setActiveTool('delay')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'delay' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Delay ms</button>
                                <button onClick={() => setActiveTool('circle')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'circle' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Círculo 5tas</button>
                                <button onClick={() => setActiveTool('capo')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'capo' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Capo Calc</button>
                                <button onClick={() => setActiveTool('analyzer')} className={`px-4 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap flex-shrink-0 ${activeTool === 'analyzer' ? 'bg-white dark:bg-slate-600 text-brand-600 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Analizador</button>
                            </div>
                        </div>
                    </div>
                    {activeTool === 'dictionary' ? <ChordDictionary /> : activeTool === 'nashville' ? <NashvilleTranslator /> : activeTool === 'tabs' ? <TabTransposer /> : activeTool === 'delay' ? <DelayCalculator /> : activeTool === 'analyzer' ? <ChordAnalyzer /> : activeTool === 'capo' ? <CapoCalculator /> : <CircleOfFifths />}
                </div>
            ); 
        };        

        const PracticeRoutine = () => { 
            const [view, setView] = useState('landing'); 
            const [currentExercise, setCurrentExercise] = useState(null); 
            const [timer, setTimer] = useState(0); 
            const [isActive, setIsActive] = useState(false); 
            const [customTime, setCustomTime] = useState(5); 
            const intervalRef = useRef(null); 
            const { getContext, resume } = useAudioContext(); 
            
            const [refIsPlaying, setRefIsPlaying] = useState(false);
            const [refString, setRefString] = useState(2); 
            const [refFret, setRefFret] = useState(9);
            const [refBpm, setRefBpm] = useState(60);
            const refTimerId = useRef(null);
            const refNextTime = useRef(0);
            
            const STRING_NAMES = ['1ra (e)', '2da (B)', '3ra (G)', '4ta (D)', '5ta (A)', '6ta (E)'];
            const OPEN_STRING_FREQS = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41]; 
            
            const EXERCISES = [
                { id: 6, category: "BAJO / TÉCNICA", name: "Spider con Retención (Bajo)", desc: "Estiramiento isométrico y soltura de dedos.", defaultTime: 5, instruction: "Este ejercicio rompe la rigidez física de los dedos (especialmente el anular y meñique). Toca el traste 5 con el índice. Al tocar el traste 6 con el medio, NO levantes el índice. Al tocar el traste 7 con el anular, NO levantes los dedos anteriores. Mantén todos presionados al avanzar cuerda por cuerda.", tab: "G|-----------------------------------------5-6-7-8--\nD|---------------------------------5-6-7-8----------\nA|---------5-6-7-8---------5-6-7-8------------------\nE|-5-6-7-8------------------------------------------" },
                { id: 7, category: "BAJO / TÉCNICA", name: "Independencia por Parejas", desc: "Entrena el control aislando pares de dedos específicos.", defaultTime: 5, instruction: "Para 'despegar' los dedos, toca alternando únicamente las parejas indicadas. Hazlo despacio en tu bajo para aislar sus músculos:\n- Pareja A (1 y 2): Trastes 5 y 6\n- Pareja B (2 y 3): Trastes 6 y 7\n- Pareja C (3 y 4): Trastes 7 y 8\n- Pareja D (Stretching 1 y 3): Trastes 5 y 7", tab: "Pareja 1 (dedos 1 y 2)    Pareja 2 (dedos 2 y 3)    Pareja 3 (dedos 3 y 4)\nG|--------------------|-------------------------|--------------------\nD|--------------------|-------------------------|--------------------\nA|---------5-6-5-6----|-------------6-7-6-7-----|---------7-8-7-8----\nE|-5-6-5-6------------|---6-7-6-7---------------|-7-8-7-8------------" },
                { id: 8, category: "BAJO / RITMO", name: "Iniciación al Slap & Pop", desc: "Aprende el golpe percusivo clásico del bajo.", defaultTime: 5, instruction: "Aprende a golpear y jalar las cuerdas:\n- T = Slap (Golpe con Pulgar): Golpea la cuerda grave (E o A) con el hueso lateral de tu pulgar sobre el último traste de tu bajo y retíralo rápidamente.\n- P = Pop (Jalón): Mete la punta de tu índice bajo la cuerda G o D, jálala hacia afuera y suéltala para que choque contra el mástil.", tab: "T = Slap (Pulgar)  |  P = Pop (Jalón Índice)\n\nG|-------P5-------P5-------P7-------P7------\nD|------------------------------------------\nA|------------------------------------------\nE|-T3-T3----T3-T3----T5-T5----T5-T5---------\n   (Sol/G)           (La/A)" },
                { id: 1, category: "CALENTAMIENTO", name: "Spider Walk (1-2-3-4)", desc: "Independencia de dedos y púa alterna.", defaultTime: 5, instruction: "Usa un dedo por traste (1=Índice, 2=Medio, 3=Anular, 4=Meñique). Usa púa alterna (Abajo, Arriba) estrictamente. Trata de no levantar los dedos del diapasón más de lo necesario, mantenlos pegados a las cuerdas.", tab: "e|-----------------------------------------1-2-3-4--\nB|---------------------------------1-2-3-4----------\nG|-------------------------1-2-3-4------------------\nD|-----------------1-2-3-4----------\nA|---------1-2-3-4----------------------------------\nE|-1-2-3-4------------------------------------------" }, 
                { id: 2, category: "TÉCNICA", name: "Bending Preciso", desc: "Afinación correcta al estirar la cuerda.", defaultTime: 5, instruction: "Toca el traste 9 (tu nota objetivo), luego haz un bending desde el traste 7 intentando igualar ese mismo tono. Apoya tu dedo anular usando la fuerza del medio y el índice. Gira la muñeca, no empujes solo con los dedos.", tab: "   (Escucha)  (Iguala el tono)\ne|----------------------------\nB|----------------------------\nG|----9----------7b9----------\nD|----------------------------\nA|----------------------------\nE|----------------------------" }, 
                { id: 3, category: "WORSHIP", name: "Tríadas Mayores (1-2-3)", desc: "Figuras esenciales para ambiente y arreglos.", defaultTime: 10, instruction: "Estas son las 3 inversiones de Sol Mayor (G) en las cuerdas agudas. El 90% de los arreglos worship usan estas formas combinadas con efectos de Delay y Reverb. Apréndelas y muévelas por el mástil.", tab: "   (Raíz)   (1ra Inv)  (2da Inv)\ne|---3---------7----------10----\nB|---3---------8----------12----\nG|---4---------7----------12----\nD|------------------------------\nA|------------------------------\nE|------------------------------" }, 
                { id: 4, category: "ESCALAS", name: "Pentatónica Menor (Caja 1)", desc: "La caja principal para construir solos.", defaultTime: 10, instruction: "Posición de La Menor (Am) en el traste 5. Toca de ida y vuelta usando el metrónomo de la app. Presta atención a que cada nota suene limpia y sin ruidos de otras cuerdas.", tab: "e|---------------------------5-8--\nB|----------------------5-8-------\nG|-----------------5-7------------\nD|------------5-7-----------------\nA|-------5-7----------------------\nE|--5-8---------------------------" }, 
                { id: 5, category: "RITMO", name: "Corcheas con Palm Mute", desc: "Control de mano derecha y limpieza.", defaultTime: 5, instruction: "Apoya el borde carnoso de tu mano derecha sobre el puente (donde nacen las cuerdas) para mutearlas. Toca corcheas constantes. Busca un sonido ahogado pero que tenga tono musical (chug).", tab: "   PM.................................\ne|------------------------------------\nB|------------------------------------\nG|------------------------------------\nD|--5-5-5-5-5-5-5-5-------------------\nA|--5-5-5-5-5-5-5-5-(Repetir)---------\nE|--3-3-3-3-3-3-3-3-------------------" }
            ]; 

            const playAlarm = async () => {
                await resume(); const ctx = getContext(); if (!ctx) return;
                [0, 0.25, 0.5].forEach(delay => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = 880; 
                    osc.connect(gain); gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + delay + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.2);
                    osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.25);
                });
            };
            
            useEffect(() => { 
                if (isActive && timer > 0) { intervalRef.current = setInterval(() => setTimer(t => t - 1), 1000); } 
                else if (timer === 0 && isActive) { setIsActive(false); if(intervalRef.current) clearInterval(intervalRef.current); playAlarm(); } 
                else if (timer === 0) { setIsActive(false); if(intervalRef.current) clearInterval(intervalRef.current); }
                return () => clearInterval(intervalRef.current); 
            }, [isActive, timer]); 

            const playRefTone = (time) => {
                const ctx = getContext(); if(!ctx) return;
                const freq = OPEN_STRING_FREQS[refString] * Math.pow(2, refFret / 12);
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.value = freq;
                osc.connect(gain); gain.connect(ctx.destination);
                gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.4, time + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, time + (60/refBpm) - 0.1);
                osc.start(time); osc.stop(time + (60/refBpm));
            };

            const scheduleRefTone = useCallback(() => {
                const ctx = getContext(); if(!ctx) return;
                while (refNextTime.current < ctx.currentTime + 0.1) {
                    playRefTone(refNextTime.current);
                    refNextTime.current += (60.0 / refBpm);
                }
                refTimerId.current = setTimeout(scheduleRefTone, 25);
            }, [refBpm, refString, refFret]);

            const toggleRefTone = async () => {
                if (refIsPlaying) { setRefIsPlaying(false); clearTimeout(refTimerId.current); } 
                else { await resume(); const ctx = getContext(); if(ctx) { refNextTime.current = ctx.currentTime + 0.05; setRefIsPlaying(true); scheduleRefTone(); } }
            };

            useEffect(() => { return () => clearTimeout(refTimerId.current); }, []);
            
            const startExercise = (ex) => { setCurrentExercise(ex); setCustomTime(ex.defaultTime); setTimer(ex.defaultTime * 60); setIsActive(false); setRefIsPlaying(false); clearTimeout(refTimerId.current); setView('active'); }; 
            const toggleTimer = () => setIsActive(!isActive); 
            const resetTimer = () => { setIsActive(false); setTimer(customTime * 60); }; 
            const adjustTime = (delta) => { const newTime = Math.max(1, customTime + delta); setCustomTime(newTime); if (!isActive) setTimer(newTime * 60); }; 
            const formatTime = (seconds) => { const m = Math.floor(seconds / 60); const s = seconds % 60; return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`; }; 
            
            if (view === 'landing') return (<div className="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 text-center animate-fade-in"><div className="w-24 h-24 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="zap" size={48} /></div><h2 className="text-2xl font-bold mb-4 dark:text-white">Gimnasio de Guitarra</h2><p className="text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">Genera una sesión equilibrada con tabs e instrucciones paso a paso.</p><button onClick={() => setView('list')} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:scale-105 transition-all w-full">Empezar a Calentar</button></div>); 
            if (view === 'list') return (<div className="max-w-2xl mx-auto space-y-6 animate-fade-in"><div className="flex justify-between items-center px-2"><h2 className="text-2xl font-bold dark:text-white">Tu Rutina de Hoy</h2><button onClick={() => setView('landing')} className="text-xs text-slate-400 font-bold hover:text-slate-600 dark:hover:text-white px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-lg">Salir</button></div><div className="space-y-4">{EXERCISES.map((ex) => (<div key={ex.id} className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center"><div><span className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-1 block">{ex.category}</span><h3 className="text-lg font-bold text-slate-800 dark:text-white mb-1">{ex.name}</h3><p className="text-xs text-slate-500 dark:text-slate-400 max-w-xs">{ex.desc}</p></div><button onClick={() => startExercise(ex)} className="bg-slate-900 dark:bg-slate-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-600 transition-colors shrink-0">Entrenar</button></div>))}</div></div>); 
            
            return (
                <div className="max-w-4xl mx-auto animate-fade-in space-y-6">
                    <div className="flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <button onClick={() => { setView('list'); setRefIsPlaying(false); clearTimeout(refTimerId.current); }} className="p-3 bg-slate-100 dark:bg-slate-700 rounded-full hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-slate-600 dark:text-white shrink-0"><Icon name="arrowLeft" size={20} /></button>
                        <div><span className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest block mb-1">{currentExercise.category}</span><h2 className="text-xl sm:text-2xl font-black dark:text-white leading-none">{currentExercise.name}</h2></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 flex flex-col">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="book" size={16}/> Instrucciones</h3>
                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-8 leading-relaxed">{currentExercise.instruction}</p>
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="grid" size={16}/> Tablatura</h3>
                            <div className="bg-[#1e1e1e] p-4 rounded-2xl shadow-inner overflow-x-auto w-full custom-scrollbar"><pre className="font-mono text-xs sm:text-sm text-emerald-400">{currentExercise.tab}</pre></div>
                            
                            {currentExercise.id === 2 && (
                                <div className="mt-6 p-4 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-2xl animate-fade-in">
                                    <h4 className="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="music" size={14}/> Tono de Referencia (Metrónomo)</h4>
                                    
                                    {/* AQUI ESTÁ EL ARREGLO DE LOS BOTONES PARA QUE NO DESBORDEN */}
                                    <div className="flex flex-wrap gap-2 items-center mt-1">
                                        <select value={refString} onChange={e=>setRefString(Number(e.target.value))} className="p-2 bg-white dark:bg-slate-800 rounded-lg text-sm font-bold text-slate-700 dark:text-white border border-slate-200 dark:border-slate-700 outline-none flex-1 min-w-[110px]">

                                        </div>
                                        <div className="flex items-center bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 px-2 flex-1 min-w-[90px]">
                                            <span className="text-xs text-slate-400 font-bold mr-1">BPM:</span>
