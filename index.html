    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {

    <style>
        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-modal { animation: modalPop 0.2s ease-out; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.85); }
        
        /* SCROLLBAR MODERNA */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }
        
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }

        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #4f46e5; margin-top: -6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #e2e8f0; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 overflow-x-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- SPLASH SCREEN DE CARGA -->
    <div id="splash-screen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-50 dark:bg-slate-950 transition-opacity duration-500">
        <div class="flex flex-col items-center animate-pulse">
            <div class="w-20 h-20 bg-gradient-to-br from-indigo-600 via-purple-600 to-violet-600 rounded-3xl flex items-center justify-center text-white font-black text-3xl shadow-2xl shadow-indigo-500/40 mb-4">
                GW
            </div>
            <p class="text-slate-400 font-bold text-sm tracking-widest uppercase">Cargando...</p>
        </div>
    </div>
    
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
            }, 800);
        });
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

        // --- Error Boundary ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("GW Error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 text-center bg-slate-50 dark:bg-slate-900">
                            <div className="max-w-md bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl">
                                <div className="text-red-500 text-5xl mb-4">⚠️</div>
                                <h2 className="text-xl font-bold mb-2 dark:text-white">Algo salió mal</h2>
                                <p className="text-slate-500 mb-6 text-sm">Error: {this.state.error?.message || 'Desconocido'}</p>
                                <button onClick={() => window.location.reload()} className="bg-brand-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-brand-700 transition-colors w-full">Recargar Aplicación</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

// --- ICONOS CORREGIDOS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                home: <g><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></g>,
                mic: <g><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></g>,
                micOff: <g><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></g>,
                activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>,
                music: <g><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></g>,
                grid: <g><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></g>,
                sun: <g><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></g>,
                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>,
                play: <polygon points="5 3 19 12 5 21 5 3"></polygon>,
                pause: <g><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></g>,
                stop: <rect x="6" y="6" width="12" height="12"></rect>,
                plus: <g><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></g>,
                minus: <line x1="5" y1="12" x2="19" y2="12"></line>,
                search: <g><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></g>,
                trash: <g><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></g>,
                edit: <g><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></g>,
                award: <g><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></g>,
                clock: <g><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></g>,
                x: <g><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></g>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>,
                analyze: <g><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></g>,
                alert: <g><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></g>,
                book: <g><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></g>,
                ear: <g><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></g>,
                circle: <circle cx="12" cy="12" r="10"></circle>,
                download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></g>,
                upload: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></g>,
                layers: <g><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></g>,
                repeat: <g><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></g>,
                lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></g>,
                file: <g><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></g>,
                check: <polyline points="20 6 9 17 4 12"></polyline>,
                rewind: <g><polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon></g>,
                arrowLeft: <g><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></g>,
                volume: <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></g>,
                tablature: <g><line x1="2" y1="7" x2="22" y2="7"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="17" x2="22" y2="17"></line><circle cx="7" cy="12" r="2.5" fill="currentColor"></circle><circle cx="17" cy="7" r="2.5" fill="currentColor"></circle></g>
            };
            return (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>);
        };

        // --- UTILS DE BASE DE DATOS (IndexedDB) ---
        const DB_NAME = 'gwt_audio_db'; const DB_STORE = 'recordings';
        const openDB = () => new Promise((resolve, reject) => { const request = indexedDB.open(DB_NAME, 1); request.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' }); }; request.onsuccess = (e) => resolve(e.target.result); request.onerror = (e) => reject(e.target.error); });
        const saveRecordingToDB = async (recording) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readwrite'); tx.objectStore(DB_STORE).put(recording); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); }); };
        const getRecordingsFromDB = async () => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readonly'); const req = tx.objectStore(DB_STORE).getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); };
        const getRecordingById = async (id) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readonly'); const req = tx.objectStore(DB_STORE).get(id); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); };
        const deleteRecordingFromDB = async (id) => { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction([DB_STORE], 'readwrite'); const req = tx.objectStore(DB_STORE).delete(id); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); };

        // --- CONTEXTOS ---
        const DialogContext = createContext();
        const DialogProvider = ({ children }) => {
            const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', type: 'confirm', onConfirm: null, promptMode: false });
            const close = () => setDialog({ ...dialog, isOpen: false, promptMode: false });
            const confirm = ({ title, message, onConfirm }) => setDialog({ isOpen: true, title, message, type: 'confirm', onConfirm: () => { onConfirm(); close(); } });
            const alert = ({ title, message }) => setDialog({ isOpen: true, title, message, type: 'alert', onConfirm: () => close() });
            const prompt = ({ title, message, onConfirm }) => setDialog({ isOpen: true, title, message, type: 'confirm', promptMode: true, onConfirm: (val) => { onConfirm(val); close(); } });
            return (
                <DialogContext.Provider value={{ confirm, alert, prompt }}>
                    {children}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-slate-100 dark:border-slate-700">
                                <div className="p-6 text-center">
                                    <div className="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4 bg-brand-100 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400"><Icon name="alert" size={24} /></div>
                                    <h3 className="text-xl font-bold mb-2 dark:text-white">{dialog.title}</h3>
                                    <p className="text-slate-500 mb-6 text-sm">{dialog.message}</p>
                                    {dialog.promptMode && <input id="promptInput" autoFocus className="w-full p-3 mb-6 bg-slate-50 dark:bg-slate-700 rounded-xl dark:text-white border border-slate-200 dark:border-slate-600" />}
                                    <div className="flex gap-3 justify-center">
                                        <button onClick={close} className="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-500 font-bold hover:bg-slate-200 transition-colors">Cancelar</button>
                                        <button onClick={() => dialog.promptMode ? dialog.onConfirm(document.getElementById('promptInput').value) : dialog.onConfirm()} className="px-6 py-2.5 rounded-xl bg-brand-600 text-white font-bold hover:bg-brand-700 transition-colors shadow-lg shadow-brand-600/20">Confirmar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </DialogContext.Provider>
            );
        };
        const useDialog = () => useContext(DialogContext);

        const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const SCALES = { 'Mayor (Jónica)': [0, 2, 4, 5, 7, 9, 11], 'Dórica': [0, 2, 3, 5, 7, 9, 10], 'Frigia': [0, 1, 3, 5, 7, 8, 10], 'Lidia': [0, 2, 4, 6, 7, 9, 11], 'Mixolidia': [0, 2, 4, 5, 7, 9, 10], 'Menor (Eólica)': [0, 2, 3, 5, 7, 8, 10], 'Locria': [0, 1, 3, 5, 6, 8, 10], 'Pentatónica Menor': [0, 3, 5, 7, 10], 'Pentatónica Mayor': [0, 2, 4, 7, 9], 'Blues': [0, 3, 5, 6, 7, 10] };
        const CHORD_FORMULAS = [{ name: "Mayor", formula: "1 - 3 - 5", example: "C - E - G" }, { name: "Menor", formula: "1 - b3 - 5", example: "C - Eb - G" }, { name: "Disminuido", formula: "1 - b3 - b5", example: "C - Eb - Gb" }, { name: "Aumentado", formula: "1 - 3 - #5", example: "C - E - G#" }, { name: "Sus2", formula: "1 - 2 - 5", example: "C - D - G" }, { name: "Sus4", formula: "1 - 4 - 5", example: "C - F - G" }, { name: "Maj7", formula: "1 - 3 - 5 - 7", example: "C - E - G - B" }, { name: "min7", formula: "1 - b3 - 5 - b7", example: "C - Eb - G - Bb" }, { name: "Dom7", formula: "1 - 3 - 5 - b7", example: "C - E - G - Bb" }];

const INSTRUMENT_CONFIGS = {
            guitar: {
                strings: ['E', 'B', 'G', 'D', 'A', 'E'],
                freqs: [329.63, 246.94, 196.00, 146.83, 110.00, 82.41],
                getDiagonalOffsets: (R) => [
                    [R + 3, R + 5, R + 7], // 1ra cuerda (e)
                    [R + 3, R + 5],        // 2da cuerda (B)
                    [R,     R + 2, R + 4], // 3ra cuerda (G)
                    [R,     R + 2],        // 4ta cuerda (D)
                    [R - 2, R,     R + 2], // 5ta cuerda (A)
                    [R - 2, R]             // 6ta cuerda (E)
                ]
            },
            bass4: {
                strings: ['G', 'D', 'A', 'E'],
                freqs: [98.00, 73.42, 55.00, 41.20],
                getDiagonalOffsets: (R) => [
                    [R,     R + 2, R + 4], // 1ra cuerda (G)
                    [R,     R + 2],        // 2da cuerda (D)
                    [R - 2, R,     R + 2], // 3ra cuerda (A)
                    [R - 2, R]             // 4ta cuerda (E)
                ]
            },
            bass5: {
                strings: ['G', 'D', 'A', 'E', 'B'],
                freqs: [98.00, 73.42, 55.00, 41.20, 30.87],
                getDiagonalOffsets: (R) => [
                    [R,     R + 2, R + 4], // 1ra cuerda (G)
                    [R,     R + 2],        // 2da cuerda (D)
                    [R - 2, R,     R + 2], // 3ra cuerda (A)
                    [R - 2, R],            // 4ta cuerda (E)
                    [R - 5, R - 2, R]      // 5ta cuerda (B)
                ]
            }
        };

        const useAudioContext = () => {
            const audioContextRef = useRef(null);
            const getContext = useCallback(() => { if (!audioContextRef.current) { const AudioContextClass = window.AudioContext || window.webkitAudioContext; if (AudioContextClass) audioContextRef.current = new AudioContextClass(); } return audioContextRef.current; }, []);
            const resume = useCallback(async () => { const ctx = getContext(); if (ctx && ctx.state === 'suspended') await ctx.resume(); return ctx; }, [getContext]);
            return { getContext, resume };
        };

        // --- PADS ENGINE ---
        const usePadEngine = () => {
            const [activeKey, setActiveKey] = useState(null); const [volume, setVolume] = useState(0.3); const [isPlaying, setIsPlaying] = useState(false); const audioCtxRef = useRef(null); const gainNodeRef = useRef(null); const oscillatorsRef = useRef([]); const KEYS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const getCtx = () => { if (!audioCtxRef.current) { const AudioContextClass = window.AudioContext || window.webkitAudioContext; const ctx = new AudioContextClass(); const masterGain = ctx.createGain(); masterGain.connect(ctx.destination); masterGain.gain.value = 0; audioCtxRef.current = ctx; gainNodeRef.current = masterGain; } return audioCtxRef.current; };
            useEffect(() => { if (gainNodeRef.current && audioCtxRef.current) gainNodeRef.current.gain.setTargetAtTime(isPlaying ? volume : 0, audioCtxRef.current.currentTime, 0.1); }, [volume, isPlaying]);

            const TrackPlayerDetail = ({ song, onBack, onEdit, onUpdateSong }) => {

                const [currentTime, setCurrentTime] = useState(0); 
                const[duration, setDuration] = useState(0); 
                const [zoomedChord, setZoomedChord] = useState(null); 
                
                const [contentView, setContentView] = useState('lyrics'); 
                const [transposeDiff, setTransposeDiff] = useState(0); // ESTADO DEL TRANSPOSITOR
                
                const [bookmarks, setBookmarks] = useState(song.bookmarks || []);
                const[trainerMode, setTrainerMode] = useState(false);
                const [countdown, setCountdown] = useState(null);

                const audioRef = useRef(null);
                const loopStartRef = useRef(null); const loopEndRef = useRef(null);
                const trainerModeRef = useRef(false); const isCountingRef = useRef(false);
                const isPlayingRef = useRef(false);
                
                useEffect(() => { loopStartRef.current = loopStart; }, [loopStart]);
                useEffect(() => { loopEndRef.current = loopEnd; }, [loopEnd]);

                useEffect(() => { isPlayingRef.current = isPlaying; },[isPlaying]);

                useEffect(() => { 
                    const audio = audioRef.current; if(!audio) return; 
                    audio.playbackRate = speed; audio.volume = volume; 
                    
                    const handleTimeUpdate = () => { 
                        setCurrentTime(audio.currentTime); 
                        const lStart = loopStartRef.current; const lEnd = loopEndRef.current;
                        if (lEnd !== null && lStart !== null && audio.currentTime >= lEnd) { 
                            if (trainerModeRef.current && !isCountingRef.current) {
                                isCountingRef.current = true;
                                audio.pause();
                                setIsPlaying(false);
                                audio.currentTime = lStart;
                                setCountdown(3);
                                let c = 3;
                                const intId = setInterval(() => {
                                    c--;
                                    if(c > 0) { setCountdown(c); } 
                                    else {
                                        clearInterval(intId);

                                        isCountingRef.current = false;

                                        setIsPlaying(true);

                                audio.currentTime = lStart;

                    const handleMetadata = () => { if(audio.duration) setDuration(audio.duration); }; 
                    const handleEnded = () => setIsPlaying(false); 
                    
                    audio.addEventListener('timeupdate', handleTimeUpdate); 
                    audio.addEventListener('loadedmetadata', handleMetadata); 
                    audio.addEventListener('ended', handleEnded); 
                    return () => { audio.removeEventListener('timeupdate', handleTimeUpdate); audio.removeEventListener('loadedmetadata', handleMetadata); audio.removeEventListener('ended', handleEnded); };

                // FUNCIÓN DEL TRANSPOSITOR
                const transposeSingleChord = (chord, diff) => {
                    const match = chord.match(/^([a-gA-G][#b]?)(.*)$/);

                    let root = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase(); 
                    let rest = match[2];
                    const flatMap = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
                    let searchRoot = flatMap[root] || root;
                    let rootIdx = NOTES.indexOf(searchRoot);

                    let newIdx = (rootIdx + diff) % 12;
                    if (newIdx < 0) newIdx += 12;
                    return NOTES[newIdx] + rest;
                };

                        if (/^[A-G][#b]?(m|min|maj|dim|aug|sus\d|add\d|maj\d|\d)*$/.test(token)) {

                        </div>

                        {/* CONTROLES DEL TRANSPOSITOR */}

                            {transposeDiff !== 0 && song.customChords && song.customChords.length > 0 && (<div className="mb-4 p-3 bg-amber-50 dark:bg-amber-900/20 rounded-xl border border-amber-100 dark:border-amber-800"><p className="text-[10px] text-amber-600 dark:text-amber-400 font-bold">Los acordes especiales visuales están ocultos. Vuelve al tono original (0) para verlos.</p></div>)}
                            
                            <pre className="whitespace-pre-wrap font-mono text-sm sm:text-base dark:text-slate-300 leading-relaxed pb-24 font-medium">{transposeText(song.body)}</pre>

             if (view === 'editor') return <SongEditor song={currentSong} onSave={saveSong} onCancel={() => currentSong.id ? setView('detail') : setView('list')} />;

             }} />;
             
             return (<div className="max-w-2xl mx-auto space-y-6"><div className="flex flex-col sm:flex-row justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 gap-4"><div className="flex items-center gap-3"><div className="p-3 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-full"><Icon name="music" size={24} /></div><div><h2 className="text-xl font-bold dark:text-white">Estudio de Canciones</h2><p className="text-xs text-slate-500">Pistas, Letras y Acordes</p></div></div><button onClick={() => { setCurrentSong({}); setView('editor'); }} className="w-full sm:w-auto bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-indigo-700 shadow-lg shadow-indigo-500/30 transition-all active:scale-95"><Icon name="plus" size={18}/> Crear Nueva</button></div><div className="flex p-1 bg-slate-200 dark:bg-slate-700 rounded-2xl"><button onClick={() => setActiveTab('my_songs')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${activeTab === 'my_songs' ? 'bg-white dark:bg-slate-800 text-indigo-600 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700'}`}>Mis Canciones</button><button onClick={() => setActiveTab('class')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${activeTab === 'class' ? 'bg-white dark:bg-slate-800 text-indigo-600 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700'}`}>Repertorio</button></div><div className="grid gap-3 animate-fade-in">{activeTab === 'my_songs' && (<>{songs.length === 0 && (<div className="text-center py-12 px-6 bg-slate-50 dark:bg-slate-800/50 rounded-3xl border-2 border-dashed border-slate-200 dark:border-slate-700"><div className="text-slate-300 mb-2"><Icon name="music" size={48} /></div><p className="text-slate-500 font-bold mb-1">Tu repertorio está vacío</p><p className="text-xs text-slate-400">Usa el botón "Crear Nueva" para subir tus MP3 y escribir letras.</p></div>)}{songs.map(song => (<div key={song.id} onClick={() => { setCurrentSong(song); setView('detail'); }} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center cursor-pointer hover:border-indigo-500 hover:shadow-md transition-all group"><div className="flex items-center gap-4 overflow-hidden"><div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${song.hasAudio ? 'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/30' : 'bg-slate-100 text-slate-400 dark:bg-slate-700'}`}><Icon name={song.hasAudio ? "music" : "file"} size={20}/></div><div className="min-w-0"><h3 className="font-bold text-slate-800 dark:text-white leading-tight truncate">{song.title}</h3><p className="text-xs text-slate-500 font-medium truncate">{song.artist || 'Artista desconocido'} {song.key && `• ${song.key}`}</p></div></div><button onClick={(e) => deleteSong(song.id, e)} className="p-3 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash" size={18}/></button></div>))} </>)}{activeTab === 'class' && (<>{TEACHER_TRACKS.map((track) => { const fullTrack = { ...track, ...(teacherData[track.id] || {}) }; return (<div key={fullTrack.id} onClick={() => { setCurrentSong(fullTrack); setView('detail'); }} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4 cursor-pointer hover:border-indigo-500 hover:shadow-md transition-all"><div className="w-12 h-12 rounded-full bg-teal-100 text-teal-600 dark:bg-teal-900/30 flex items-center justify-center shrink-0 font-bold text-lg">{fullTrack.title.charAt(0)}</div><div className="min-w-0"><h3 className="font-bold text-slate-800 dark:text-white leading-tight truncate">{fullTrack.title}</h3><p className="text-xs text-teal-600 font-bold truncate">{fullTrack.artist}</p></div><div className="ml-auto text-slate-300"><Icon name="play" size={20} /></div></div>); })}<p className="text-center text-[10px] text-slate-400 mt-4">Estas canciones están incluidas en la aplicación.</p></>)}</div></div>);

         const ProgressStats = () => { const [stats, setStats] = useState({ streak: 0, totalMinutes: 0, lastDate: null }); const dialog = useDialog(); useEffect(() => { loadStats(); const handleUpdate = () => loadStats(); window.addEventListener('gwt-stats-updated', handleUpdate); return () => window.removeEventListener('gwt-stats-updated', handleUpdate); }, []); const loadStats = () => { const savedRaw = localStorage.getItem('gwt_stats'); const saved = savedRaw ? JSON.parse(savedRaw) : { streak: 0, totalMinutes: 0, lastDate: null }; setStats(saved); }; const resetStats = () => { dialog.confirm({ title: "¿Reiniciar estadísticas?", message: "Esto borrará tu racha actual y los minutos acumulados.", onConfirm: () => { localStorage.setItem('gwt_stats', JSON.stringify({ streak: 0, totalMinutes: 0, lastDate: null })); window.dispatchEvent(new Event('gwt-stats-updated')); } }); }; return (<div className="relative group"><div className="grid grid-cols-2 gap-4 w-full"><div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col items-center relative overflow-hidden"><div className="p-2 bg-orange-100 dark:bg-orange-900/30 text-orange-600 rounded-full mb-2 z-10"><Icon name="award" size={20} /></div><span className="text-2xl font-bold text-slate-800 dark:text-white z-10">{stats.streak}</span><span className="text-xs text-slate-500 font-medium z-10">Días racha</span></div><div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col items-center"><div className="p-2 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full mb-2"><Icon name="clock" size={20} /></div><span className="text-2xl font-bold text-slate-800 dark:text-white">{stats.totalMinutes.toFixed(1)}</span><span className="text-xs text-slate-500 font-medium">Minutos totales</span></div></div><button onClick={resetStats} className="absolute -top-3 -right-3 p-2 bg-slate-200 dark:bg-sl          const ScaleStudio = () => { 
            const [root, setRoot] = useState('C');

            const STRINGS = config.strings;
            const OPEN_STRING_FREQS = config.freqs;
            const { getContext, resume } = useAudioContext();

            // Función pedagógica para calcular dinámicamente los trastes de cada Caja
            const getBoxRange = (boxNum) => {
                const rootIdx = NOTES.indexOf(root);
                const eIdx = NOTES.indexOf(STRINGS[STRINGS.length - 1]); // Cuerda más grave (E o B)
                let R = (rootIdx - eIdx + 12) % 12;
                
                const isMajor = (SCALES[scaleName] || []).includes(4);
                let start = 0;
                let end = 0;
                
                if (isMajor) {
                    switch (boxNum) {
                        case 1: start = R - 1; end = R + 2; break;
                        case 2: start = R + 2; end = R + 5; break;
                        case 3: start = R + 4; end = R + 7; break;
                        case 4: start = R + 7; end = R + 10; break;
                        case 5: start = R + 9; end = R + 12; break;
                    }
                } else {
                    switch (boxNum) {
                        case 1: start = R;     end = R + 3; break;
                        case 2: start = R + 2; end = R + 5; break;
                        case 3: start = R + 4; end = R + 8; break;
                        case 4: start = R + 7; end = R + 10; break;
                        case 5: start = R + 9; end = R + 12; break;
                    }
                }
                
                if (start < 0) { start += 12; end += 12; }
                if (end > 22) { start -= 12; end -= 12; }
                
                return { start, end };
