                                        <button onClick={toggleRefTone} className={`w-full px-4 py-2.5 mt-1 rounded-lg font-bold text-sm text-white shadow-md transition-transform active:scale-95 flex items-center justify-center gap-1 ${refIsPlaying ? 'bg-amber-500' : 'bg-indigo-600'}`}>
                                            <Icon name={refIsPlaying ? "stop" : "play"} size={16} fill="currentColor"/> {refIsPlaying ? 'Detener' : 'Sonar'}
                                        </button>
                                    </div>

                                </div>
                            )}
                        </div>

                        <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center">
                            <div className="relative w-56 h-56 sm:w-64 sm:h-64 mx-auto mb-8 flex items-center justify-center">
                                <div className="absolute inset-0 rounded-full border-8 border-slate-100 dark:border-slate-700"></div>
                                <div className={`absolute inset-0 rounded-full border-8 border-indigo-500 transition-all duration-1000 ${isActive ? 'opacity-100' : 'opacity-30'}`} style={{ clipPath: `inset(0 0 ${100 - (timer / (customTime * 60) * 100)}% 0)` }}></div>
                                <div className="flex flex-col items-center z-10">
                                    <span className="text-5xl sm:text-6xl font-black font-mono text-slate-800 dark:text-white tracking-tighter">{formatTime(timer)}</span>
                                    {!isActive && (
                                        <div className="flex gap-4 mt-4">
                                            <button onClick={() => adjustTime(-1)} className="p-2 text-slate-400 bg-slate-100 dark:bg-slate-700 rounded-lg hover:text-indigo-500"><Icon name="minus" size={16}/></button>
                                            <span className="text-sm font-bold text-slate-500 flex items-center">{customTime} min</span>
                                            <button onClick={() => adjustTime(1)} className="p-2 text-slate-400 bg-slate-100 dark:bg-slate-700 rounded-lg hover:text-indigo-500"><Icon name="plus" size={16}/></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex gap-4 justify-center w-full max-w-[200px]">
                                <button onClick={toggleTimer} className={`flex-[2] h-14 rounded-2xl flex items-center justify-center shadow-lg transition-transform active:scale-95 ${isActive ? 'bg-amber-500 text-white' : 'bg-indigo-600 text-white'}`}>
                                    <Icon name={isActive ? "pause" : "play"} size={28} fill="currentColor" />
                                </button>
                                <button onClick={resetTimer} className="flex-1 h-14 rounded-2xl bg-slate-100 dark:bg-slate-700 text-slate-500 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                                    <Icon name="repeat" size={20} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            ); 
        };
                
         const SettingsPanel = ({ darkMode, setDarkMode, onClose }) => {
            const dialog = useDialog(); // Usamos el sistema de diálogo de la app

            const downloadBackup = () => {
                const data = {
                    songs: JSON.parse(localStorage.getItem('gwt_songs') || '[]'),
                    chords: JSON.parse(localStorage.getItem('gwt_chord_library') || '[]'),
                    stats: JSON.parse(localStorage.getItem('gwt_stats') || '{}'),
                    date: new Date().toLocaleDateString()
                };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                // Nombre del archivo con fecha para organizarse mejor
                a.download = `GW_Respaldo_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            const loadBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        
                        // Validación simple para asegurar que es un archivo de la app
                        if (!data.songs && !data.stats) throw new Error("Formato incorrecto");

                        if (data.songs) localStorage.setItem('gwt_songs', JSON.stringify(data.songs));
                        if (data.chords) localStorage.setItem('gwt_chord_library', JSON.stringify(data.chords));
                        if (data.stats) localStorage.setItem('gwt_stats', JSON.stringify(data.stats));
                        
                        // --- MENSAJE DE ÉXITO CON DISEÑO DE LA APP ---
                        dialog.confirm({
                            title: "¡Restauración Exitosa!",
                            message: "Tus canciones y datos se han cargado correctamente. ¿Deseas reiniciar la aplicación ahora para ver los cambios?",
                            onConfirm: () => window.location.reload()
                        });

                    } catch (err) { 
                        // --- MENSAJE DE ERROR CON DISEÑO DE LA APP ---
                        dialog.alert({
                            title: "Error de Archivo",
                            message: "El archivo seleccionado no es válido o está dañado. Por favor selecciona un archivo .json generado por Guitar Worship Trainer."
                        });
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 animate-fade-in">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-2xl font-bold dark:text-white">Configuración</h2>
                        <button onClick={onClose} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                    </div>

                    <div className="space-y-6">
                        <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-full"><Icon name={darkMode ? "moon" : "sun"} size={20}/></div>
                                <div>
                                    <p className="font-bold text-sm dark:text-white">Tema Visual</p>
                                    <p className="text-xs text-slate-500">{darkMode ? 'Modo Oscuro' : 'Modo Claro'}</p>
                                </div>
                            </div>
                            <button onClick={() => setDarkMode(!darkMode)} className={`w-12 h-7 rounded-full transition-colors relative ${darkMode ? 'bg-indigo-600' : 'bg-slate-300'}`}>
                                <div className={`absolute top-1 w-5 h-5 rounded-full bg-white transition-all shadow-sm ${darkMode ? 'left-6' : 'left-1'}`}></div>
                            </button>
                        </div>

                        <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Datos y Seguridad</h3>
                            <button onClick={downloadBackup} className="w-full p-4 bg-emerald-50 dark:bg-emerald-900/10 text-emerald-600 font-bold rounded-xl mb-3 flex items-center justify-center gap-2 hover:bg-emerald-100 transition-colors border border-transparent hover:border-emerald-200">
                                <Icon name="download" size={20}/> Descargar Copia de Seguridad
                            </button>
                            <label className="w-full p-4 bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-slate-200 transition-colors border border-transparent hover:border-slate-300">
                                <Icon name="upload" size={20}/> Restaurar Copia
                                <input type="file" accept=".json" className="hidden" onChange={loadBackup} />
                            </label>
                            <p className="text-[10px] text-slate-400 text-center mt-2 italic">El archivo .json sirve para mover tus datos entre PC y Celular.</p>
                        </div>
                        
                        <div className="text-center pt-4">
                            <p className="text-[10px] text-slate-400">Versión 2.2.0 (Pro)</p>
                        </div>
                    </div>
                </div>
            );
        };

         // --- RECUPERACIÓN DEL PAD PLAYER ---
        const PadPlayer = ({ engine }) => { 
            const { activeKey, setActiveKey, volume, setVolume, isPlaying, togglePlay, KEYS } = engine; 
            return (
                <div className="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 animate-fade-in">
                    <div className="flex items-center gap-4 mb-8">
                        <div className="p-3 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-full"><Icon name="layers" size={32} /></div>
                        <div><h2 className="text-3xl font-black dark:text-white">Worship Pads</h2><p className="text-slate-500 text-sm">Sonido ambiental continuo</p></div>
                    </div>
                    <div className="grid grid-cols-4 gap-3 mb-8">
                        {KEYS.map(k => (<button key={k} onClick={() => setActiveKey(k)} className={`py-4 rounded-xl font-bold text-lg transition-all shadow-sm ${activeKey === k && isPlaying ? 'bg-indigo-600 text-white shadow-indigo-500/50 scale-105' : 'bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600'}`}>{k}</button>))}
                    </div>
                    <div className="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-2xl flex items-center gap-6">
                        <button onClick={togglePlay} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-lg transition-all active:scale-95 shrink-0 ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400'}`}><Icon name={isPlaying ? "pause" : "play"} size={28} fill="currentColor" /></button>
                        <div className="flex-1">
                            <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Volumen Master</label>
                            <input type="range" min="0" max="1" step="0.01" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-full h-2 bg-slate-200 rounded-full appearance-none cursor-pointer dark:bg-slate-700 accent-indigo-600"/>
                        </div>
                    </div>
                </div>
            ); 
        };

         const Footer = () => (<footer className="w-full text-center py-8 text-xs text-slate-400 font-medium">Copyright © 2026 LUFTMANDMAURICIO</footer>);
         
         // BOTONES MOVIDOS AFUERA PARA EVITAR QUE EL SCROLL SALTE
         const NavItem = ({ id, icon, label, view, setView, isAction = false, onClick = null }) => { 
            const active = view === id;
            const handleClick = () => {
                if (navigator.vibrate) navigator.vibrate(40);
                if (onClick) onClick(); else setView(id);
            };
            if (isAction) { return (<button onClick={handleClick} className="flex-shrink-0 min-w-[4.5rem] flex flex-col items-center gap-1 p-2 rounded-2xl transition-all text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/10 active:scale-95"><div className="p-2 rounded-full"><Icon name={icon} size={24} /></div><span className="text-[10px] font-bold">{label}</span></button>); } 
            return (
                <button onClick={handleClick} className={`flex-shrink-0 min-w-[4.5rem] flex flex-col items-center gap-1 p-2 rounded-2xl transition-all duration-300 active:scale-95 ${active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 scale-105' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                    <div className={`p-1`}><Icon name={icon} size={24} strokeWidth={active ? 2.5 : 2} /></div>
                    <span className={`text-[10px] font-bold ${active ? 'text-white' : ''}`}>{label}</span>
                </button>
            ); 
         };

         const PanicButton = () => (
            <button onClick={() => window.location.reload()} className="flex-shrink-0 min-w-[4.5rem] flex flex-col items-center gap-1 p-2 rounded-2xl transition-all text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 active:scale-95 group" title="Detener todo">
                <div className="p-2 rounded-full border-2 border-red-500 group-hover:bg-red-500 group-hover:text-white transition-colors"><Icon name="micOff" size={24} /></div>
                <span className="text-[9px] font-bold text-red-500">SILENCIO</span>
            </button>
         );

         const App = () => {
            const [view, setView] = useState('home');
            const [darkMode, setDarkMode] = useState(false);
            const [updateTrigger, setUpdateTrigger] = useState(0);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstall, setShowInstall] = useState(false);
            const padEngine = usePadEngine();

            useEffect(() => {
                const keepAwake = async () => {
                    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (err) { }
                };
                keepAwake();
                window.addEventListener('click', keepAwake, { once: true });
                window.addEventListener('touchstart', keepAwake, { once: true });
            }, []);

            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setDarkMode(true);
                const handleStorage = () => setUpdateTrigger(p => p + 1);
                window.addEventListener('storage', handleStorage);
                window.addEventListener('gwt-stats-updated', () => setUpdateTrigger(p => p + 1));
                window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); });
                return () => { window.removeEventListener('storage', handleStorage); };
            }, []);

            useEffect(() => { darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark'); }, [darkMode]);

            const installApp = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { setDeferredPrompt(null); setShowInstall(false); } };

            return (
                <DialogProvider>
                    <div className="min-h-screen pb-24 md:pb-0 md:pl-28 flex flex-col bg-slate-50 dark:bg-slate-950">
                        {/* --- MENÚ LATERAL PC --- */}
                        <nav className="glass-nav hidden md:flex fixed left-0 top-0 h-screen w-28 border-r border-slate-200/60 dark:border-slate-800/60 flex-col z-50 py-8 items-center shadow-[4px_0_30px_-10px_rgba(0,0,0,0.1)]">
                            <div className="w-14 h-14 bg-gradient-to-br from-indigo-600 via-purple-600 to-violet-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30 mb-6 cursor-pointer hover:scale-110 transition-transform duration-300 active:scale-95" onClick={() => setView('home')} title="Ir a Inicio">GW</div>
                            <div className="flex-1 overflow-y-auto w-full px-3 flex flex-col items-center gap-4 no-scrollbar pb-4 pt-2">
                                <NavItem id="settings" icon="lock" label="Ajustes" view={view} setView={setView} />
                                <div className="w-12 h-[1px] bg-slate-200 dark:bg-slate-700 my-1 shrink-0"></div>
                                <NavItem id="tuner" icon="mic" label="Afinar" view={view} setView={setView} />
                                <NavItem id="tracks" icon="music" label="Pistas" view={view} setView={setView} />
                                <NavItem id="metronome" icon="activity" label="Tempo" view={view} setView={setView} />
                                <NavItem id="pads" icon="layers" label="Pads" view={view} setView={setView} />
                                <div className="w-12 h-[1px] bg-slate-200 dark:bg-slate-700 my-1 shrink-0"></div>
                                <NavItem id="looper" icon="repeat" label="Studio" view={view} setView={setView} />
                                <NavItem id="routine" icon="zap" label="Rutinas" view={view} setView={setView} />
                                <NavItem id="scales" icon="grid" label="Escalas" view={view} setView={setView} />
                                <NavItem id="ear" icon="ear" label="Oído" view={view} setView={setView} />
                                <NavItem id="analyze" icon="analyze" label="Teoría" view={view} setView={setView} />
                                {showInstall && <div className="w-12 h-[1px] bg-slate-200 dark:bg-slate-700 my-1"></div>}
                                <div className="w-12 h-[1px] bg-slate-200 dark:bg-slate-700 my-1 shrink-0"></div>
                                <PanicButton />
                                {showInstall && <NavItem id="install" icon="download" label="Instalar" isAction={true} onClick={installApp} view={view} setView={setView} />}
                            </div>
                        </nav>
                        
                        {/* --- MENÚ MÓVIL DESLIZANTE --- */}
                        <nav className="glass-nav md:hidden fixed bottom-0 left-0 w-full border-t border-slate-200/60 dark:border-slate-800/60 z-50 px-2 py-3 flex items-center gap-1 overflow-x-auto no-scrollbar safe-area-pb shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.1)]">
                            <NavItem id="home" icon="home" label="Inicio" view={view} setView={setView} />
                            <NavItem id="settings" icon="lock" label="Ajustes" view={view} setView={setView} />
                            <div className="h-8 w-[1px] bg-slate-200 dark:bg-slate-700 mx-1 shrink-0"></div>
                            <NavItem id="tracks" icon="music" label="Pistas" view={view} setView={setView} />
                            <NavItem id="tuner" icon="mic" label="Afinar" view={view} setView={setView} />
                            <NavItem id="metronome" icon="activity" label="Tempo" view={view} setView={setView} />
                            <NavItem id="pads" icon="layers" label="Pads" view={view} setView={setView} />
                            <NavItem id="looper" icon="repeat" label="Studio" view={view} setView={setView} />
                            <NavItem id="routine" icon="zap" label="Rutinas" view={view} setView={setView} />
                            <NavItem id="scales" icon="grid" label="Escalas" view={view} setView={setView} />
                            <NavItem id="ear" icon="ear" label="Oído" view={view} setView={setView} />
                            <NavItem id="analyze" icon="analyze" label="Teoría" view={view} setView={setView} />
                            <div className="h-8 w-[1px] bg-slate-200 dark:bg-slate-700 mx-1 shrink-0"></div>
                            <PanicButton />
                        </nav>
                        <main className="max-w-5xl mx-auto p-4 md:p-12 pb-32 animate-fade-in flex-grow w-full">
                            <div className="flex justify-between items-center md:hidden mb-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-lg" onClick={() => setView('home')}>GW</div>
                                    <span className="font-bold text-lg dark:text-white">Trainer Pro</span>
                                </div>
                                <button onClick={() => setView('settings')} className="p-2 bg-white dark:bg-slate-800 rounded-full shadow-sm text-slate-500"><Icon name="lock" size={20} /></button>
                            </div>
                            
                            {padEngine.isPlaying && view !== 'pads' && (
                                <div onClick={() => setView('pads')} className="fixed bottom-24 right-4 md:bottom-8 md:right-8 bg-indigo-600 text-white p-3 rounded-full shadow-2xl z-[60] cursor-pointer animate-pulse-ring flex items-center justify-center">
                                    <Icon name="layers" size={24} />
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{padEngine.activeKey}</span>
                                </div>
                            )}

                            {view === 'home' && (
                                <div className="space-y-10 py-8">
                                    <div className="text-center space-y-5">
                                        <h1 className="flex flex-wrap justify-center gap-x-3 text-4xl md:text-5xl font-extrabold text-slate-800 dark:text-white">
                                            <span>Guitar</span><span className="text-brand-600">Worship</span><span>Trainer</span>
                                        </h1>
                                        <p className="text-slate-500 dark:text-slate-400 max-w-lg mx-auto text-lg">Tu compañero de ensayo todo en uno.</p>
                                        <div className="max-w-md mx-auto mt-6"><ProgressStats key={updateTrigger} /></div>
                                    </div>
                                    
                                    <div>
                                        <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Herramientas</h3>

                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="mic" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="mic" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Afinador</h3><p className="text-xs text-indigo-100 font-medium mt-1">Cromático</p>
                                            </div>
                                            <div onClick={() => setView('tracks')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-violet-500/90 to-fuchsia-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-violet-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="music" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="music" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Pistas & Songs</h3><p className="text-xs text-violet-100 font-medium mt-1">Player y Letras</p>
                                            </div>
                                            <div onClick={() => setView('metronome')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-rose-500/90 to-orange-500/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-rose-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="activity" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="activity" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Metrónomo</h3><p className="text-xs text-rose-100 font-medium mt-1">Speed Trainer</p>
                                            </div>
                                            <div onClick={() => setView('pads')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-blue-500/90 to-indigo-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-blue-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="layers" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="layers" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Worship Pads</h3><p className="text-xs text-blue-100 font-medium mt-1">Ambiente continuo</p>
                                            </div>
                                            <div onClick={() => setView('looper')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-teal-500/90 to-emerald-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-teal-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="repeat" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="repeat" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Studio Looper</h3><p className="text-xs text-teal-100 font-medium mt-1">Graba, Loopea y Guarda Ideas</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Entrenamiento</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                            <div onClick={() => setView('routine')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-amber-500/90 to-yellow-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-amber-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="zap" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="zap" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Rutinas</h3><p className="text-xs text-amber-100 font-medium mt-1">Eléctrica</p>
                                            </div>
                                            <div onClick={() => setView('scales')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-emerald-500/90 to-teal-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-emerald-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="grid" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="grid" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Escalas</h3><p className="text-xs text-emerald-100 font-medium mt-1">Mástil & Tríadas</p>
                                            </div>
                                            <div onClick={() => setView('ear')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-fuchsia-500/90 to-pink-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-fuchsia-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="ear" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="ear" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Oído</h3><p className="text-xs text-fuchsia-100 font-medium mt-1">Entrenador</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 px-1">Conocimiento</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                            <div onClick={() => setView('analyze')} className="relative overflow-hidden p-6 rounded-3xl cursor-pointer group hover:-translate-y-1 transition-all duration-300 bg-gradient-to-br from-violet-500/90 to-fuchsia-600/90 backdrop-blur-xl border border-white/20 dark:border-white/10 shadow-xl shadow-violet-500/20 text-white">
                                                <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity duration-300 rotate-12 scale-150"><Icon name="analyze" size={100} /></div>
                                                <div className="mb-4 bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/30 group-hover:scale-110 transition-transform"><Icon name="analyze" size={24} /></div>
                                                <h3 className="font-bold text-lg tracking-wide">Teoría</h3><p className="text-xs text-violet-100 font-medium mt-1">Analizador & Más</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'settings' && <SettingsPanel darkMode={darkMode} setDarkMode={setDarkMode} onClose={() => setView('home')} />}
                            {view === 'tuner' && <Tuner />}
                            {view === 'tracks' && <TrackTrainer />}
                            <Metronome currentView={view} goToMetronome={() => setView('metronome')} />
                            {view === 'routine' && <PracticeRoutine />}
                            {view === 'analyze' && <TheoryHub />}
                            {view === 'scales' && <ScaleStudio />}
                            {view === 'ear' && <EarTrainer />}
                            {view === 'looper' && <StudioLooper />}
                            {view === 'pads' && <PadPlayer engine={padEngine} />}
                        </main>
                        <Footer />
                    </div>
                </DialogProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
      </script>
      
   </body>
</html>
