
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Guitar Worship Trainer Pro</title>
    
    <!-- Favicon de emergencia para evitar 404 -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <!-- Evitar caché agresiva -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Scripts base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f4ff', 500: '#6366f1', 600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        #root:empty::before {
            content: "Iniciando sistema...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #6366f1;
            font-weight: bold;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 antialiased">
    <div id="root"></div>

    <!-- Cargador bypass para GitHub Pages (evita error de MIME Type) -->
    <script type="text/babel" data-presets="react,typescript">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        
        // Cargamos el punto de entrada manualmente para asegurar que Babel lo procese
        async function bootstrap() {
            try {
                const response = await fetch('./index.tsx');
                if (!response.ok) throw new Error('No se pudo cargar index.tsx');
                const code = await response.text();
                
                // Transformar y ejecutar el código de index.tsx
                const transformed = Babel.transform(code, {
                    presets: ['react', 'typescript'],
                    filename: 'index.tsx'
                }).code;
                
                // Crear un blob para ejecutar como módulo
                const blob = new Blob([transformed], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                await import(url);
            } catch (err) {
                console.error("Error al iniciar la app:", err);
                document.getElementById('root').innerHTML = `<div style="padding: 20px; color: red;">Error crítico: ${err.message}. Revisa la consola.</div>`;
            }
        }
        
        bootstrap();
    </script>

    <script>
        // Limpieza agresiva de Service Workers antiguos
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let reg of registrations) reg.unregister();
            });
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
